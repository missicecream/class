<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CM R6 · Coconut Structure Limits</title>
  <link rel="stylesheet" href="yd-lab.css">
  <style>
    .wrap{width:min(1320px,100%)}
    .formula-grid,.taste-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .batch-columns{grid-template-columns:repeat(3,minmax(0,1fr))}
    .batch-column .radio-group{grid-template-columns:1fr}

    .research-grid h3{margin:0 0 5px;color:var(--accent)}
    .marker{border:2px solid #d6b56e;border-radius:12px;background:var(--amberbg);padding:11px;margin:10px 0;text-align:center}
    .marker .btn{width:100%;background:var(--amber);border-color:var(--amber);color:#fff}
    .wide{grid-column:1/-1}
    @media(max-width:900px){.batch-columns{grid-template-columns:repeat(3,minmax(340px,1fr));overflow-x:auto;max-width:100%;padding-bottom:8px;scroll-snap-type:x mandatory}.batch-column{scroll-snap-align:start}.formula-grid,.taste-grid,.research-grid,.verdict-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
    @media print{.batch-columns{display:block}.batch-column{break-before:page}.batch-title{position:static}.formula-grid,.taste-grid{grid-template-columns:repeat(3,1fr)}}

<body>
<header><div class="wrap"><a class="back" href="index.html">← กลับหน้าหลัก</a><h1>CM R6 · Coconut Structure Limits</h1><p>3 ถัง · CMDL06 → CMDL12 → CMNL11 · ถังละ 2,000 g · Frigomat G10</p><div class="statusline"><div class="progress"><i id="progress"></i></div><span class="save-state" id="saveState">บันทึกอัตโนมัติ</span></div></div></header>
<main class="wrap"><div id="app"></div><div class="toolbar no-print"><button class="btn" type="button" onclick="document.getElementById('importFile').click()">📂 นำเข้า JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn danger" id="resetBtn" type="button">ล้างข้อมูล</button></div></main>
<footer>CM R6 · MR v8.7.1 · ทดลอง 10 สิงหาคม 2026 · ข้อมูลเก็บในเครื่องนี้</footer>
<script>
(() => {
'use strict';
const C={
 file:'CMR6',title:'CM R6 · ทดสอบขอบบน/ขอบล่างของโครงเบสกะทิใหม่',subtitle:'ไขมัน 6/12 และสาย N 11 · กะทิลอย · TS 30 · G10 · PBT ×3',
 purpose:'นำสูตรที่อยู่ขอบสุดของโครงเบสกะทิใหม่ 3 ตัวเข้าครัวก่อน เพื่อดูว่าขอบเขตที่คำนวณไว้ใช้ได้จริงหรือไม่',
 critical:'รอบ feasibility ไม่มีถัง control · เปลี่ยน 5 ตัวแปรพร้อมกัน จึงสรุปได้เฉพาะผ่าน/ไม่ผ่าน · ทำทีละถัง A → B → C ห้ามสลับ · SEP ละลายที่ 65 °C ไม่ใช่ 85 °C',
 batches:{
  A:{code:'CMDL06',summary:'ขอบล่างสุด · Fat 6.01% · TS 30.03%',facts:'RSW 14.80 · FWT 58.69 · กะทิน้อยสุด · นมผงมากสุด',cream:true,formula:['① SEP 12 + SUC 86 + WTR 946 → 65 °C','② PMP 100 + DEX 100 + INL 60 + MTD 92 + SLT 2 + CCM 560','③ CRM 42 ที่ ≤10 °C']},
  B:{code:'CMDL12',summary:'ขอบบนสาย D · Fat 12.01% · TS 31.16%',facts:'RSW 14.72 · FWT 59.02 · ครีมมากสุด',cream:true,formula:['① SEP 10 + SUC 74 + WTR 476 → 65 °C','② PMP 40 + DEX 100 + INL 60 + SLT 2 + CCM 1,120','③ CRM 118 ที่ ≤10 °C']},
  C:{code:'CMNL11',summary:'ขอบบนสาย N · Fat 11.00% · TS 30.09%',facts:'RSW 14.85 · FWT 60.86 · ไขมันกะทิ 10.68% · ไม่มีนม',cream:false,formula:['① SEP 10 + SUC 74 + WTR 468 → 65 °C','② DEX 100 + INL 60 + MTD 30 + SLT 2 + CCM 1,256','③ ไม่มีครีม']}
 },
 limits:['n = 1 ถังต่อสูตร · ไม่มีถัง control','เปลี่ยน 5 ตัวแปรพร้อมกัน: ช่วงไขมัน · ปริมาณกะทิ · TS · เป้าความหวาน · อินูลิน','สรุปสาเหตุไม่ได้ สรุปได้แค่ผ่าน/ไม่ผ่าน · ผู้ชิมคนเดียว ไม่มีนัยทางสถิติ','เทียบข้ามสาย D ↔ N ไม่ได้ · ยังไม่ทดสอบสูตรตรงกลาง (ไขมัน 9 · สาย B · สาย C)']
};
const BATCHES=['A','B','C'],KEY='missicecream.'+C.file+'.v1';let D=load();
const app=document.getElementById('app'),saveState=document.getElementById('saveState'),progress=document.getElementById('progress');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(e){}return{values:{date:'2026-08-10'},timers:{},updated:null}}
function save(){D.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(D));saveState.textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});progress.style.width=Math.min(100,Object.values(D.values).filter(v=>v!==''&&v!==false).length/1.05)+'%'}
function k(id,b){return b?id+'__'+b:id}function val(id,b){return D.values[k(id,b)]??''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a={}){return Object.entries(a).map(([x,y])=>y===null||y===undefined?'':` ${x}="${esc(y)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function area(id,label,help='',b=null){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function select(id,label,opts,help='',b=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function calc(id,label,unit='',b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${k(id,b)}">${val(id,b)!==''?esc(val(id,b))+(unit?' '+unit:''):'—'}</div><div class="warning" data-warn="${id}" data-batch="${b||''}"></div></div>`}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function timeText(ms){return ms?new Date(ms).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'medium'}):'—'}
function duration(start,stop,b){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)];return a&&z&&z>=a?(z-a)/60000:null}
function clock(start,stop,b,mode='up'){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)],sec=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0,t=mode==='down'?Math.max(0,1800-sec):sec;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function manual(id,label,b){return `<label>${label}<input type="datetime-local" data-manual="${id}" data-batch="${b}" value="${esc(toLocal(D.timers[k(id,b)]))}"></label>`}
function timer(start,stop,label,b,mode='up'){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}" data-mode="${mode}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b,mode)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}">เริ่ม</button><button class="btn amber" type="button" data-stamp="${stop}" data-batch="${b}">หยุด</button></div><div class="help">เริ่ม: ${timeText(D.timers[k(start,b)])} · หยุด: ${timeText(D.timers[k(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual(start,'เริ่ม',b)}${manual(stop,'หยุด',b)}</div></details></div>`}
function coolingTimer(b){const cream=C.batches[b].cream,mid=D.timers[k('time_at_10c',b)];return `<div class="timer" data-timer="cool_start" data-stop="cool_end" data-batch="${b}" data-mode="up"><div class="timer-label">Cooling ถึง 4 °C</div><div class="timer-clock">${clock('cool_start','cool_end',b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="cool_start" data-pair="cool_end" data-batch="${b}">เริ่มลงอ่าง</button><button class="btn amber" type="button" data-stamp="cool_end" data-batch="${b}">ถึง 4 °C</button></div>${cream?`<div class="marker"><button class="btn" type="button" data-stamp="time_at_10c" data-batch="${b}">ถึง 10 °C — เติมครีม</button><div class="help">เวลาที่กด: ${timeText(mid)}</div></div>`:''}<div class="help">เริ่ม: ${timeText(D.timers[k('cool_start',b)])} · ถึง 4 °C: ${timeText(D.timers[k('cool_end',b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual('cool_start','เริ่ม',b)}${cream?manual('time_at_10c','ถึง 10 °C',b):''}${manual('cool_end','ถึง 4 °C',b)}</div></details></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function formulaCard(b){const x=C.batches[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.summary}</p><ul>${x.formula.map(y=>`<li>${y}</li>`).join('')}</ul><div class="facts">${x.facts}</div><div class="total">รวม 2,000 g</div></article>`}
function batchColumn(b){const x=C.batches[b];return `<div class="batch-column"><section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${b==='A'?'1':b==='B'?'2':'3'} · คอลัมน์ ${b}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.summary} · กรอกจากบนลงล่าง</p></section><section class="screen">
${stage('1 · ต้ม SEP · อุ่นมิกซ์ · PBT',select('sep_dissolve','สารคงตัวละลายหมดไหม',['เนียนดี','มีเม็ดเล็กน้อย','เป็นเม็ดสาคูชัด'],'SEP + น้ำตาล + น้ำ → 65 °C',b)+field('temp_pbt_start','อุณหภูมิในโถตอนเริ่ม PBT (°C)','เป้า ≥58 °C','number',b,{step:'0.1'})+`<div class="callout"><b>PBT 3 รอบ</b> · รอบละ 30 วินาที · พัก 10 วินาที</div>`+field('temp_pbt_end','อุณหภูมิจบ PBT (°C)','เป้า 55–60 °C','number',b,{step:'0.1'})+select('pbt_note','ลักษณะมิกซ์หลัง PBT',['เนียนดี','มีฟองมาก','เห็นเม็ดไขมัน','อื่นๆ'],'',b))}
${stage('2 · Cooling',coolingTimer(b)+calc('cool_total','เวลา Cooling รวม','นาที',b)+field('cool_lowest','อุณหภูมิต่ำสุดที่ทำได้ (°C)','เป้า ≤4 °C','number',b,{step:'0.1'}),'อ่างน้ำแข็ง + overhead stirrer · เป้า 4 °C ภายในไม่เกิน 60 นาที')}
${stage('3 · บ่มสั้น 30 นาที',timer('age_start','age_stop','นับถอยหลังบ่ม 30 นาที',b,'down')+calc('age_minutes','เวลาบ่มจริง','นาที',b),'บ่มที่ 0–4 °C')}
${stage('4 · เทลงเครื่องและปั่น',field('cup_empty','น้ำหนักถ้วยเปล่า (g)','','number',b,{step:'0.1'})+field('cup_mix','น้ำหนักถ้วย + มิกซ์ ไม่มีฟอง (g)','ตักส่วนที่ไม่มีฟอง','number',b,{step:'0.1'})+field('entry_temp','อุณหภูมิมิกซ์ตอนเทเข้าเครื่อง (°C)','บันทึกค่าจริง','number',b,{step:'0.1'})+timer('churn_start','churn_stop','จับเวลาปั่น',b)+select('machine_stop_type','เครื่องหยุดเพราะ',['หยุดปกติ','ตัด overload','กดหยุด'],'',b))}
${stage('5 · ปั่นเสร็จ · %OR',field('draw_temp','อุณหภูมิตอนปั่นเสร็จ (°C)','บันทึกค่าจริง','number',b,{step:'0.1'})+field('cup_ic_1','น้ำหนักถ้วย + ไอศกรีม ครั้งที่ 1 (g)','เท ไม่ตัก','number',b,{step:'0.1'})+field('cup_ic_2','น้ำหนักถ้วย + ไอศกรีม ครั้งที่ 2 (g)','เท ไม่ตัก · ต่างจากครั้งแรกเกิน 3 g ต้องชั่งใหม่','number',b,{step:'0.1'})+calc('ic_repeat','ตรวจการชั่ง 2 ครั้ง','',b)+calc('ic_net','น้ำหนักไอศกรีมสุทธิที่ใช้','g',b)+calc('or_pct','%OR','%',b)+select('texture_after','เนื้อตอนปั่นเสร็จ',['แห้งปกติ','แห้งเงาสวยมาก','น้ำซึมเล็กน้อย','เหลวผิดปกติ'],'',b)+area('deviation','เบี่ยงเบนจากสเปกทั้งหมด','ถ้าไม่มีให้เขียนว่า “ไม่มี”',b),'ถ้าสองครั้งต่างกัน ≤3 g ใช้ค่าเฉลี่ย · ถ้าเกิน 3 g ระบบหยุดคำนวณและให้ชั่งใหม่')}
</section></div>`}
function score(id,label,min,max,help,b){if(max===10)return field(id,label,'กรอกคะแนน 0–10','number',b,{min,max,step:'1'});const vs=Array.from({length:max-min+1},(_,i)=>min+i),cls=vs.length===4?'scale scale4':'scale';return `<div class="field"><span>${label}</span><div class="${cls}">${vs.map(v=>`<label><input type="radio" name="${k(id,b)}" data-id="${id}" data-batch="${b}" value="${v}"${String(val(id,b))===String(v)?' checked':''}><span>${v>0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small><div class="warning" data-warn="${id}" data-batch="${b}"></div></div>`}
function tasteCard(b){return `<article class="taste-card"><h3>ถัง ${b} · ${C.batches[b].code}</h3>${score('s_scoop','ตักง่าย–ยาก',-3,3,'−3 ตักยากมาก · 0 พอดี · +3 นิ่มเละ',b)}${score('s_sweet','ความหวานโดยรวม',-3,3,'−3 จืดไป · 0 พอดี · +3 หวานไป',b)}${score('s_body','เนื้อแน่น (body)',-3,3,'−3 บางไป · 0 พอดี · +3 หนักไป',b)}${score('s_cold','อุ่น–เย็นลิ้น',-3,3,'−3 อุ่น · 0 ไม่เย็นลิ้น · +3 เย็นลิ้นมาก',b)}${score('s_icy','ความสาก',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_creamy','Creamy หอม',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_buttery','Buttery เพดานปาก',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_oil','น้ำมันลอย / แยกชั้น',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_coconut','ความเด่นของกลิ่นกะทิ',0,3,'0 ไม่ได้กลิ่น · 3 เด่นมาก',b)}${score('s_dairy','ความเด่นของกลิ่นนม',0,3,'0 ไม่ได้กลิ่น · 3 เด่นมาก',b)}${score('s_off','รสกลิ่นแปลก',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_melt','อัตราการละลาย',-3,3,'−3 ช้าไป · 0 พอดี · +3 เร็วไป',b)}${score('s_like','ชอบโดยรวม',0,10,'0–10',b)}${area('s_note','บันทึกเพิ่ม','',b)}</article>`}
function criterion(id,label){return select(id,label,['ผ่าน','ไม่ผ่าน'])}function hSelect(id,label,opts){return `<div>${select(id,label,opts)}${area(id.replace('_verdict','_note'),'เหตุผล / หลักฐานที่ใช้ตัดสิน')}</div>`}
function render(){let html=`<section class="screen"><div class="eyebrow">แผนการทดลอง · อ่านก่อนเริ่ม</div><h2>${C.title}</h2><p class="lead">${C.purpose}</p><div class="callout danger">${C.critical}</div><div class="formula-grid">${BATCHES.map(formulaCard).join('')}</div><details><summary>หัวข้อที่ต้องตอบและข้อจำกัดการตีความ</summary><div class="research-grid"><article><h3>H1 · กะทิน้อยสุด</h3><p>กะทิใน CMDL06 ยังเด่นพอ หรือถูกกลิ่นนมจาก PMP ทับหรือไม่</p></article><article><h3>H2 · Buttery</h3><p>CMNL11 ที่ไขมันกะทิ 10.68% เกิดเม็ดเนย น้ำมันลอย หรือแยกชั้นหรือไม่</p></article><article><h3>H3 · TS 30</h3><p>FWT 59–61 ทำให้ตักยากหรือสากขึ้นจนเกินเกณฑ์หรือไม่</p></article><article><h3>H4 · ความหวาน</h3><p>A และ B ที่ RSW ใกล้กัน แต่ mouthcoat ต่างกัน รู้สึกหวานเท่ากันหรือไม่</p></article></div></details><details><summary>ขั้นตอนหลักและเกณฑ์</summary><ol><li>ทำทีละถัง A → B → C ห้ามสลับ</li><li>SEP + น้ำตาล + น้ำ → 65 °C จนเนียน</li><li>คลุกของแห้งก่อนโรยลงกะทิ ห้ามโรยลงหม้อร้อนโดยตรง</li><li>รวมมิกซ์ → 68–70 °C แล้วยกลงทันที</li><li>PBT 3 รอบ รอบละ 30 วินาที พัก 10 วินาที · เริ่ม ≥58 °C · จบ 55–60 °C</li><li>Cooling ถึง 10 °C เติมครีมเฉพาะ A/B แล้วไปต่อถึง 4 °C ภายในไม่เกิน 60 นาที · บ่ม 30 นาที</li><li>เทลงเครื่อง จับเวลาปั่นจนเครื่องหยุด · ชั่งไอศกรีมแบบเทไม่ตัก 2 ครั้ง · เก็บ −18 °C</li></ol></details></section>`;
html+=`<section class="screen"><div class="eyebrow">ทำครั้งเดียวก่อนเริ่ม</div><h2>ข้อมูลตั้งต้นวัน</h2>${field('date','วันที่ทดลอง','','date')}${field('operator','ผู้ทำ','','text')}</section>`;
html+=`<section class="screen"><div class="eyebrow">ช่วงผลิตจริง</div><h2>ถัง A → B → C</h2><p class="sub">แต่ละถังเป็นคอลัมน์ของตัวเองและเรียงช่องจากบนลงล่าง · ผลิตทีละถัง ห้ามสลับลำดับ</p></section><div class="batch-columns">${BATCHES.map(batchColumn).join('')}</div>`;
html+=`<section class="screen"><div class="eyebrow">เปิดกรอกตอนชิม</div><h2>Blind tasting · ชิมพร้อมกัน 3 ถัง</h2><div class="callout warn">ปิดฉลาก สุ่มตำแหน่ง และ temper เท่ากันทุกถัง</div><div class="taste-grid">${BATCHES.map(tasteCard).join('')}</div><div class="stage"><h3>เทียบคู่ A ↔ B · อ่านเป็นทิศทางเท่านั้น</h3>${select('p_coconut','กลิ่นกะทิ',['A เด่น','B เด่น','ใกล้กัน'])}${select('p_dairy','กลิ่นนม',['A เด่น','B เด่น','ใกล้กัน'])}${select('p_sweet','ความหวานที่รู้สึก',['A หวานกว่า','B หวานกว่า','ใกล้กัน'])}${select('p_body','ความแน่นของเนื้อ',['A เด่น','B เด่น','ใกล้กัน'])}</div></section>`;
html+=`<section class="screen"><div class="eyebrow">ท้ายการทดลอง</div><h2>Hypothesis Verdict</h2><h3>เกณฑ์ดิบ</h3>${criterion('v_pbt','PBT ครบ 3 รอบ และจบ 55–60 °C ทุกถัง')}${criterion('v_cool','ลงถึง 4 °C ภายใน 60 นาทีทุกถัง')}${criterion('v_texture','เนื้อแห้งปกติหรือแห้งเงาสวยมาก ไม่มีเม็ดเนยทุกถัง')}${criterion('v_buttery','Buttery ≤1 และน้ำมันลอย = 0 ทุกถัง')}${criterion('v_scoop','Scoop อยู่ในช่วง −1 ถึง +1 ทุกถัง')}${criterion('v_coconut','กลิ่นกะทิ ≥2 ทุกถัง')}<h3>ตัดสินสมมติฐาน</h3><div class="verdict-grid">${hSelect('h1_verdict','H1 · กะทิ 280 + นมผง 50',['กะทิพอ ใช้ได้','นมทับกะทิ','ปัญหาอยู่ที่อื่น','ตัดสินไม่ได้'])}${hSelect('h2_verdict','H2 · Buttery ที่ไขมันกะทิ 10.68%',['ผ่าน buttery 0','ผ่านแบบมีเงื่อนไข','ไม่ผ่าน','ตัดสินไม่ได้'])}${hSelect('h3_verdict','H3 · TS 30 / FWT 59–61',['ใช้ได้ทุกถัง','เฉพาะ C แข็ง','แข็งทั้งเบส','ตัดสินไม่ได้'])}${hSelect('h4_verdict','H4 · ความหวานและ mouthcoat',['ต่าง ≤1 ขั้น','ต่าง ≥2 ขั้น','จืดไปทั้งคู่','ตัดสินไม่ได้'])}</div><h3>Decision</h3>${select('verdict','สรุปรวม',['ผ่าน — เดินหน้า solve ตรงกลาง','ผ่านบางส่วน','ไม่ผ่าน ต้องรื้อ'])}${area('conclusion','ข้อสรุป')}${area('action1','สิ่งที่ต้องทำต่อ 1')}${area('action2','สิ่งที่ต้องทำต่อ 2')}${area('action3','สิ่งที่ต้องทำต่อ 3')}<div class="callout warn"><b>ข้อจำกัด — ห้ามลบจากรายงาน</b><ul class="limits">${C.limits.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="toolbar"><button class="btn primary" type="button" id="exportBtn">💾 ส่งออก JSON</button><button class="btn" type="button" onclick="window.print()">🖨 พิมพ์ / PDF</button></div></section>`;
app.innerHTML=html;bind();syncAll();updateClocks();save()}
function n(x){const z=parseFloat(x);return Number.isFinite(z)?z:null}
function setCalc(id,b,x,unit=''){const el=document.getElementById('calc_'+k(id,b));if(x===null){delete D.values[k(id,b)];if(el){el.textContent='—';el.className='calc'};return}D.values[k(id,b)]=typeof x==='number'?x.toFixed(1):x;if(el)el.textContent=D.values[k(id,b)]+(unit?' '+unit:'')}
function warn(id,b,msg){const el=document.querySelector(`[data-warn="${id}"][data-batch="${b||''}"]`);if(el){el.textContent=msg;el.classList.toggle('show',!!msg)}}
function sync(b){const cool=duration('cool_start','cool_end',b),age=duration('age_start','age_stop',b);setCalc('cool_total',b,cool,'นาที');setCalc('age_minutes',b,age,'นาที');const empty=n(val('cup_empty',b)),mixGross=n(val('cup_mix',b)),i1=n(val('cup_ic_1',b)),i2=n(val('cup_ic_2',b)),grossDiff=i1!==null&&i2!==null?Math.abs(i1-i2):null,valid=grossDiff!==null&&grossDiff<=3,iceGross=valid?(i1+i2)/2:null,icNet=empty!==null&&iceGross!==null&&iceGross>empty?iceGross-empty:null,mixNet=empty!==null&&mixGross!==null&&mixGross>empty?mixGross-empty:null,or=mixNet!==null&&icNet!==null&&icNet>0?(mixNet-icNet)/icNet*100:null,repeat=grossDiff===null?null:`รวมถ้วย ${i1.toFixed(1)} / ${i2.toFixed(1)} g · ต่าง ${grossDiff.toFixed(1)} g → ${valid?'ใช้ค่าเฉลี่ย':'ชั่งใหม่'}`;setCalc('ic_repeat',b,repeat);setCalc('ic_net',b,icNet,'g');setCalc('or_pct',b,or,'%');warn('ic_repeat',b,grossDiff!==null&&grossDiff>3?'สองครั้งต่างกันเกิน 3 g — ต้องชั่งใหม่ก่อนคำนวณ %OR':'');warn('cup_mix',b,mixGross!==null&&mixNet===null?(empty===null?'กรอกน้ำหนักถ้วยเปล่าก่อน':'ถ้วย + มิกซ์ต้องหนักกว่าถ้วย'):'');warn('cup_ic_1',b,i1!==null&&empty!==null&&i1<=empty?'ถ้วย + ไอศกรีมต้องหนักกว่าถ้วย':'');warn('cup_ic_2',b,i2!==null&&empty!==null&&i2<=empty?'ถ้วย + ไอศกรีมต้องหนักกว่าถ้วย':'');const ps=n(val('temp_pbt_start',b)),pe=n(val('temp_pbt_end',b)),entry=n(val('entry_temp',b)),low=n(val('cool_lowest',b));warn('temp_pbt_start',b,ps!==null&&ps<58?'เบสเย็นเกินไปก่อนเข้า PBT — จดลง deviation':'');warn('temp_pbt_end',b,pe!==null&&(pe<55||pe>60)?'จบ PBT นอกสเปก — จดลง deviation':'');warn('entry_temp',b,entry!==null&&entry>5?'มิกซ์ยังไม่เย็นพอ · R5 เคยค้างที่ 6 °C แล้ว %OR ตก':'');warn('cool_lowest',b,low!==null&&low>4?'มิกซ์ยังไม่ถึงเป้า ≤4 °C':'');warn('cool_total',b,cool!==null&&cool>60?'เวลา Cooling เกิน 60 นาที':'');warn('age_minutes',b,age!==null&&(age<25||age>40)?'เวลาบ่มนอกช่วง 25–40 นาที':'');warn('s_buttery',b,n(val('s_buttery',b))>=2?'ตรวจ H2 — ดูว่า PBT ครบ 3 รอบไหม':'');const orEl=document.getElementById('calc_'+k('or_pct',b));if(orEl&&or!==null)orEl.className='calc '+(or>=25&&or<=45?'good':'bad')}
function syncAll(){BATCHES.forEach(sync);const draws=BATCHES.map(b=>n(val('draw_temp',b))).filter(x=>x!==null),ors=BATCHES.map(b=>n(val('or_pct',b))).filter(x=>x!==null),drawMsg=draws.length>=2&&Math.max(...draws)-Math.min(...draws)>2?'อุณหภูมิตอนดึงออกต่างกันเกิน 2 °C — เทียบเนื้อข้ามถังไม่ได้':'',orMsg=ors.length>=2&&Math.max(...ors)-Math.min(...ors)>5?'%OR ต่างกันเกิน 5 จุด — อ่านผล H3 ต้องระวัง':'';BATCHES.forEach(b=>{const own=n(val('or_pct',b)),ownMsg=own!==null&&(own<25||own>45)?'%OR นอกช่วง 25–45':'';warn('draw_temp',b,drawMsg);warn('or_pct',b,orMsg||ownMsg)});save()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{D.values[k(el.dataset.id,el.dataset.batch||null)]=el.type==='checkbox'?el.checked:el.value;syncAll()}));document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;D.timers[k(id,b)]=Date.now();if(el.dataset.pair)D.timers[k(el.dataset.pair,b)]=null;beep();syncAll();render()});document.querySelectorAll('[data-manual]').forEach(el=>el.onchange=()=>{D.timers[k(el.dataset.manual,el.dataset.batch)]=el.value?new Date(el.value).getTime():null;syncAll();render()});document.getElementById('exportBtn').onclick=exportJSON}
function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>el.querySelector('.timer-clock').textContent=clock(el.dataset.timer,el.dataset.stop,el.dataset.batch,el.dataset.mode))}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function exportJSON(){const blob=new Blob([JSON.stringify({_form:C.file,_title:C.title,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=C.file+'-'+(D.values.date||'data')+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x._form!==C.file||!x.values||!x.timers)throw 0;D={values:x.values,timers:x.timers,updated:x.updated||null};save();render();alert('นำเข้าข้อมูลแล้ว')}catch(_){alert('ไฟล์นี้ใช้กับแบบฟอร์ม CMR6 ไม่ได้')}};r.readAsText(f)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดของ CMR6? การทำงานนี้ย้อนกลับไม่ได้')){localStorage.removeItem(KEY);location.reload()}};
setInterval(()=>{updateClocks();BATCHES.forEach(b=>{const start=D.timers[k('age_start',b)],stop=D.timers[k('age_stop',b)];if(start&&!stop&&Math.floor((Date.now()-start)/1000)===1800)beep()})},1000);
render();
})();
</script>
</body>
</html>
