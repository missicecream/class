<header><div class="wrap"><a class="back" href="index.html">← กลับหน้าหลัก</a><h1>SO R1 · สตรอว์เบอร์รี × L/B/C ขั้น 12</h1><p>A · SONL12 หวานน้อย → B · SONB12 หวานกลาง → C · SONC12 หวานมาก · Frigomat G5 · ถังละ 1,000 g · ไม่บ่ม</p><div class="statusline"><span class="save-state" id="saveState" role="status">บันทึกอัตโนมัติในเครื่องนี้</span></div></div></header>

<footer>07SO-LabRecord-R1 + LabTeam R1 · v2 · 17 ก.ย. 2569 · MR v8.9.0 · ข้อมูลเก็บในเครื่องนี้ — ส่งออก JSON หลังทำเสร็จ</footer>
<script>
(() => {
'use strict';
const FORM='SOR1',TITLE='SO R1 · สตรอว์เบอร์รี × L/B/C ขั้น 12 · v8.9.0',KEY='missicecream.SOR1.v2';
const BATCHES=['A','B','C'],PEOPLE=['P1','P2','P3'];
const RECIPES={A:{code:'SONL12',level:'หวานน้อย',dex:70,water:375,rsw:14.93,ts:17.6,ice:69.6},B:{code:'SONB12',level:'หวานกลาง',dex:90,water:355,rsw:17.08,ts:19.5,ice:65.9},C:{code:'SONC12',level:'หวานมาก',dex:105,water:340,rsw:18.75,ts:20.8,ice:63.2}};
const LIMITS='n=1 ต่อระดับ · ผลไม้เดียว (สตรอว์เบอร์รี) · ไม่มี control สูตรเดิม\nตัวแปรเดียวคือ DEX ในส่วนน้ำเชื่อม · ส่วนผลไม้ชุดเดียว แบ่ง 3\n%OR และ draw temperature ใช้ประกอบการตีความความแข็ง ไม่ใช่เป้าผ่าน/ตก\nSYR อ่านผิดจะเลื่อนบริกซ์ทั้งชุดทางเดียวกัน · ผล H0 จับความคลาดได้\nผลเปรียบเทียบการชิมใช้ตัดสินเมื่อทุกถัง temper ถึง −14 °C และชิมพร้อมกัน';
const HYPOTHESES=[['H0','ทูล / บริกซ์','ส่วนผลไม้ชุดเดียวอ่าน 11.5–12.5 °Bx หรือไม่ · ถ้าคลาดให้ตรวจวิธีวัด SYR/ผลไม้ก่อน ไม่แก้สูตรหน้างาน'],['H1','ความแข็ง vs RSW','ระดับต่ำสุดที่คะแนนตัก ≥−1 อย่างน้อย 2 ใน 3 คน = พื้นระบบที่ −14 °C · ถ้าลำดับความนิ่มไม่เป็น A → B → C ให้ดู %OR / draw temp ร่วมด้วย'],['H2','หวานพอดี','คะแนนหวาน −1 ถึง +1 อย่างน้อย 2 ใน 3 คน · คะแนนหวาน 1–9 ควรเรียง A < B < C ของผู้ชิมแต่ละคน'],['H3','%OR','จดตามจริง · คาด 10–25 ไม่ใช่เกณฑ์ผ่าน/ตก · ถ้าต่างกันเกิน 10 จุดเปอร์เซ็นต์ ต้องตีความ H1 ด้วยความระวัง'],['H4','เดกซ์โทรส','พิจารณาหวานแบน เย็นลิ้น และค้างคอแยกกัน · เด่นที่ C อาจพิจารณา SUC ขั้นต่ำหรือ re-solve หลังจบรอบ'],['H5','ความเปรี้ยว','คะแนน −1 ถึง +1 = ใกล้พอดี · ดูแนวโน้ม A → C · ไม่ใส่ซิตริกในรอบนี้'],['H6','เนื้อ SER','เม็ดขาว หนืดยืด น้ำซึม — เก็บข้อสังเกตส่งต่อ R2']];
let D=load();
const app=document.getElementById('app');
function empty(){return{values:{date:'',operator1:'',operator2:'',taster1:'',taster2:'',taster3:'',limits:LIMITS},timers:{},updated:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(_){}return empty()}
function key(id,b,p){return [id,b,p].filter(Boolean).join('__')}
function val(id,b,p){return D.values[key(id,b,p)]??''}
function n(x){if(x===''||x===null||x===undefined)return null;const z=Number(x);return Number.isFinite(z)?z:null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a){return Object.entries(a).map(([k,v])=>` ${k}="${esc(v)}"`).join('')}
function field(id,label,help='',type='number',b=null,p=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''}${p?` data-person="${p}"`:''} value="${esc(val(id,b,p))}"${attrs(type==='number'?{step:'0.1',...a}:a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${key(id,b,p)}"></div></label>`}
function area(id,label,help='',b=null,p=null){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}${p?` data-person="${p}"`:''}>${esc(val(id,b,p))}</textarea>${help?`<small class="help">${help}</small>`:''}</label>`}
function select(id,label,opts,help='',b=null,p=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}${p?` data-person="${p}"`:''}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b,p)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}</label>`}
function calc(id,label,b=null,p=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${key(id,b,p)}">—</div><div class="warning" data-warn="${key(id,b,p)}"></div></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function timeText(ms){return ms?new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function seconds(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)];return a&&z&&z>=a?(z-a)/1000:null}
function clock(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)],s=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0;return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function timer(start,stop,label,b,startText,stopText){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}"${D.timers[key(start,b)]?' disabled':''}>${startText}</button><button class="btn amber" type="button" data-stamp="${stop}" data-start="${start}" data-batch="${b}"${!D.timers[key(start,b)]||D.timers[key(stop,b)]?' disabled':''}>${stopText}</button></div><div class="help">เริ่ม: ${timeText(D.timers[key(start,b)])} · หยุด: ${timeText(D.timers[key(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${[start,stop].map((id,i)=>`<label>${i?'หยุด':'เริ่ม'}<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label>`).join('')}</div></details></div>`}
function recipe(b){const x=RECIPES[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code} · ${x.level}</h3><ul><li>ส่วนผลไม้ 500 g จากชุดเดียวกัน</li><li>ผงฐาน 55 + DEX <b>${x.dex}</b> + น้ำ ${x.water} g</li><li>SUC 0 · ซิตริก 0 · PBT 2 รอบ</li></ul><div class="facts">RSW ${x.rsw} · TS ${x.ts}% · น้ำแข็งที่ −14 °C ${x.ice}%</div><div class="total">รวมมิกซ์ตามสูตร 1,000 g</div></article>`}
function production(b){const x=RECIPES[b];return `<div class="batch-column"><section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${BATCHES.indexOf(b)+1}</div><h2>ถัง ${b} · ${x.code} · ${x.level}</h2><p class="sub">DEX ${x.dex} g · กรอกจากบนลงล่าง</p></section><section class="screen">
${stage('1 · ส่วนน้ำเชื่อม · เย็น · รวมผลไม้',`<div class="callout">ผงฐาน 55 + DEX <b>${x.dex}</b> + น้ำ ${x.water} g · คลุกผงกับ DEX ก่อนโรยลงน้ำ · ต้ม <b>85 °C</b> · เติมน้ำที่ระเหยคืนให้ครบ <b>500 g</b> · ติดป้ายถัง ${b} ทันที · เย็น ≤10 °C ก่อนรวมผลไม้</div>`+field('syrup_boil_temp','อุณหภูมิสูงสุดที่ต้มส่วนน้ำเชื่อม (°C)','ตามแผน 85 °C','number',b)+field('syrup_water_back','น้ำที่เติมคืนหลังต้ม (g)','ชั่งเติมคืนจนส่วนน้ำเชื่อมครบ 500 g','number',b,null,{min:0})+field('fp_split_g','น้ำหนักส่วนผลไม้ที่แบ่งใส่ถังนี้ (g)','เป้า 500.0 g · คนชุดใหญ่ก่อนแบ่งทุกครั้ง','number',b,null,{min:0})+field('syrup_temp_combine','อุณหภูมิส่วนน้ำเชื่อมตอนรวม (°C)','ต้อง ≤10 °C','number',b)+field('fp_temp_combine','อุณหภูมิส่วนผลไม้ตอนรวม (°C)','ต้อง ≤10 °C · ห้ามใส่ผลไม้ตอนร้อน','number',b))}
${stage('2 · PBT · ลดอุณหภูมิถึง 4 °C',`<div class="callout">PBT <b>2 รอบ × 30 วินาที พัก 10 วินาที</b> · รวมเวลาประมาณ 70 วินาที · เมื่อจบ แช่เย็นต่อถึง 4 °C · <b>ไม่บ่ม</b> · ล้างและพักเครื่องให้พร้อมก่อนมิกซ์ถึง 4 °C</div>`+timer('pbt_start','pbt_stop','จับเวลา PBT ตั้งแต่เริ่มรอบ 1 ถึงจบรอบ 2',b,'เริ่ม PBT รอบ 1','จบ PBT รอบ 2')+calc('pbt_seconds','เวลา PBT จริง (วินาที)',b)+select('foam_after_pbt','ฟองหลัง PBT',['ไม่มี','บาง','หนา'],'',b)+timer('cool_start_time','time_at_4c','Cooling หลัง PBT ถึง 4 °C',b,'เริ่ม Cooling','ถึง 4 °C / พร้อมเท')+calc('cool_total','เวลา Cooling หลัง PBT (นาที)',b)+select('mix_look','ลักษณะมิกซ์ก่อนเท',['ไหลใส','ข้นแต่ยังไหล','แยกชั้น/ตกตะกอน','อื่นๆ'],'',b)+area('mix_look_note','รายละเอียดมิกซ์ (ถ้ามี)','',''+b))}
${stage('3 · ชั่งมิกซ์ 2 ครั้ง · เทเข้าโถ',`<div class="callout"><b>①</b> เทฟองลงโถก่อน <b>②</b> เทส่วนไม่เป็นฟองใส่ถ้วย เคาะไล่ฟอง ปาดเรียบ ชั่ง 2 ครั้ง <b>③</b> เทคืนลงโถทั้งหมด <b>④</b> วัดอุณหภูมิในโถ <b>⑤</b> กดเริ่มนาฬิกาพร้อมเดินเครื่อง · ใช้ถ้วยใบเดียวกันทั้ง 3 ถัง</div>`+field('cup_empty','น้ำหนักถ้วยเปล่า — สำหรับวัด %OR (g)','ชั่งตอนถ้วยแห้งสนิทก่อนเริ่ม · ใช้ถ้วยใบเดียวกันทุกถัง กรอกค่าน้ำหนักที่ชั่งไว้','number',b,null,{min:0})+field('cup_mix_1','น้ำหนักถ้วย + มิกซ์ ปาดเรียบ — ครั้งที่ 1 (g)','น้ำหนักรวมถ้วย · เท ไม่ตัก · เคาะไล่ฟองก่อนปาด','number',b,null,{min:0})+field('cup_mix_2','น้ำหนักถ้วย + มิกซ์ ปาดเรียบ — ครั้งที่ 2 (g)','เทออกแล้วเทใหม่ เคาะไล่ฟอง และปาดใหม่','number',b,null,{min:0})+calc('mix_net','น้ำหนักมิกซ์สุทธิเฉลี่ย 2 ครั้ง (g)',b)+field('entry_temp','อุณหภูมิมิกซ์ในโถก่อนกดปั่น (°C)','หลัง Cooling ถึง 4 °C · บันทึกค่าจริง · 3 ถังต่างกันไม่เกิน 1 °C','number',b)+calc('entry_spread','ช่วงอุณหภูมิเข้าโถระหว่าง 3 ถัง (°C)',b))}

function score(id,label,min,max,help,b,p,rescue=false){const extra={'data-taste':rescue?'12':'14'};if(max>=9)return `<div class="score-field" data-score-batch="${b}" data-gate="${rescue?'12':'14'}">${field(id,label,help,'number',b,p,{min,max,step:1,...extra})}</div>`;const values=Array.from({length:max-min+1},(_,i)=>min+i);return `<div class="field score-field" data-score-batch="${b}" data-gate="${rescue?'12':'14'}"><span>${label}</span><div class="scale${max===3&&min===0?' scale4':''}">${values.map(v=>`<label><input type="radio" name="${key(id,b,p)}" data-id="${id}" data-batch="${b}" data-person="${p}" data-taste="${rescue?'12':'14'}" value="${v}"${String(val(id,b,p))===String(v)?' checked':''}><span>${v>0&&min<0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small></div>`}

<section class="screen"><div class="eyebrow">แยกช่วงชิมออกจากช่วงผลิต</div><h2>ชิมพร้อมกัน 3 ถัง · −14 °C · แยกคะแนน 3 คน</h2><p class="lead">Temper ให้กลางถังทุกถังถึง −14 °C · ชิม A → B → C แล้วย้อน · จดคะแนนแต่ละคน ไม่สรุปเป็นค่าเดียว</p><p class="sub">ช่องหลักเปิดแยกถังเมื่อกรอกอุณหภูมิ หากอยู่นอก −14.5 ถึง −13.5 ให้เก็บผลไว้แต่ยังไม่ใช้ตัดสิน H1 / H2 · ตักไม่ได้ให้จด −14 ก่อน แล้วค่อยลอง −12 ในช่องสำรอง</p></section>${parallelGroup('tasting',BATCHES.map(tastingColumn).join(''))}
<section class="screen"><h2>ความหวานที่ชอบที่สุด · คนละ 1 คำตอบ</h2><div class="single-fields">${PEOPLE.map((p,i)=>`<h3 data-person-title="${p}">ผู้ชิม ${i+1}</h3>${select('s_rank','ถังที่ชอบความหวานที่สุด',['A · หวานน้อย','B · หวานกลาง','C · หวานมาก'],'เลือกหลังชิมครบ 3 ถัง',null,p)}`).join('')}</div></section>
<section class="screen"><h2>สรุปคะแนนจริง · ไม่ใช่ Verdict อัตโนมัติ</h2><div class="summary-grid">${BATCHES.map(b=>`<article><h3>ถัง ${b} · ${RECIPES[b].code}</h3>${calc('summary_scoop','ตักที่ −14 °C · คะแนน ≥−1',b)}${calc('summary_sweet','หวานพอดี · คะแนน −1 ถึง +1',b)}</article>`).join('')}</div>${PEOPLE.map((p,i)=>calc('sweet_order','ผู้ชิม '+(i+1)+' · คะแนนหวาน 1–9 เรียง A < B < C',null,p)).join('')}${calc('or_spread','%OR สูงสุด − ต่ำสุดของ 3 ถัง (จุดเปอร์เซ็นต์)')}</section>
<section class="screen"><h2>Hypothesis Verdict · ผล → ตีความ → ทำอะไรต่อ</h2>${HYPOTHESES.map(h=>`<div class="verdict"><h3>${h[0]} · ${h[1]}</h3><p class="sub">${h[2]}</p><div class="single-fields">${area(h[0].toLowerCase()+'_result','ผลที่พบ')}${area(h[0].toLowerCase()+'_interpretation','ตีความ / หลักฐาน / ข้อจำกัด')}${area(h[0].toLowerCase()+'_next','ทำอะไรต่อ')}</div></div>`).join('')}<div class="single-fields">${select('verdict','Verdict รวม',['ล็อก L/B/C ขั้น 12 ทั้ง 3 → R2 ผลไม้อื่น + S/E','ล็อกบางระดับ — ระบุในสรุป','เลื่อนแผง RSW — ระบุในสรุป','ไม่ผ่าน — แข็งเกินทุกระดับ','ตัดสินไม่ได้'])}${area('conclusion','สรุป / ระดับที่เลือก')}${field('action1','Action ถัดไป 1','','text')}${field('action2','Action ถัดไป 2','','text')}${field('action3','Action ถัดไป 3','','text')}${area('limits','ข้อจำกัดการตีความ','แก้ไข / เพิ่มเติมได้')}</div></section>`;
bind();syncAll();updateClocks();document.querySelectorAll('[data-column-group]').forEach(el=>{el.scrollLeft=scrolls[el.dataset.columnGroup]||0;syncColumnNav(el)});save();}
function setCalc(id,b,p,x,unit=''){const el=document.getElementById('calc_'+key(id,b,p));if(x===null){delete D.values[key(id,b,p)];if(el)el.textContent='—';return}D.values[key(id,b,p)]=typeof x==='number'?x.toFixed(1):x;if(el)el.textContent=D.values[key(id,b,p)]+(unit?' '+unit:'')}
function warn(id,b,p,msg){const el=document.querySelector(`[data-warn="${key(id,b,p)}"]`);if(el){el.textContent=msg;el.classList.toggle('show',!!msg)}}
function iceSelection(b,cup){const weights=[1,2,3].map(i=>n(val('cup_ic_'+i,b)));if(!(cup>0&&weights[0]>cup&&weights[1]>cup))return{needThird:false,selected:null,note:null};const diff=Math.abs(weights[0]-weights[1]);if(diff<=3)return{needThird:false,selected:(weights[0]+weights[1])/2-cup,note:`ครั้งที่ 1↔2 ต่าง ${diff.toFixed(1)} g → ใช้ค่าเฉลี่ย`};if(!(weights[2]>cup))return{needThird:true,selected:null,note:`ครั้งที่ 1↔2 ต่าง ${diff.toFixed(1)} g → ต้องชั่งครั้งที่ 3`};const pairs=[[0,1],[0,2],[1,2]].map(([a,b])=>({a,b,d:Math.abs(weights[a]-weights[b])})).sort((a,b)=>a.d-b.d),best=pairs[0];return best.d<=3?{needThird:true,selected:(weights[best.a]+weights[best.b])/2-cup,note:`ใช้ครั้งที่ ${best.a+1} และ ${best.b+1} · คู่ใกล้ที่สุดต่าง ${best.d.toFixed(1)} g`}:{needThird:true,selected:null,note:`คู่ใกล้ที่สุดยังต่าง ${best.d.toFixed(1)} g (>3 g) → ชั่งใหม่ ยังไม่คำนวณ %OR`}}
function syncBatch(b){const cup=n(val('cup_empty',b)),gross1=n(val('cup_mix_1',b)),gross2=n(val('cup_mix_2',b)),mix=cup>0&&gross1>cup&&gross2>cup?(gross1+gross2)/2-cup:null,ice=iceSelection(b,cup);
setCalc('pbt_seconds',b,null,seconds('pbt_start','pbt_stop',b),'วินาที');const cool=seconds('cool_start_time','time_at_4c',b),churn=seconds('churn_start','churn_stop',b);setCalc('cool_total',b,null,cool===null?null:cool/60,'นาที');setCalc('churn_minutes',b,null,churn===null?null:churn/60,'นาที');setCalc('mix_net',b,null,mix,'g');setCalc('ic_check',b,null,ice.note);setCalc('ic_net',b,null,ice.selected,'g');setCalc('overrun',b,null,mix>0&&ice.selected>0?(mix-ice.selected)/ice.selected*100:null,'%');document.querySelector(`[data-third="${b}"]`).classList.toggle('hidden',!ice.needThird);
warn('cup_empty',b,null,cup!==null&&cup<=0?'น้ำหนักถ้วยเปล่าต้องมากกว่า 0':'');['cup_mix_1','cup_mix_2','cup_ic_1','cup_ic_2','cup_ic_3'].forEach(id=>{const g=n(val(id,b));warn(id,b,null,g!==null&&!(cup>0)?'กรอกน้ำหนักถ้วยเปล่าก่อน':g!==null&&g<=cup?'น้ำหนักรวมถ้วยต้องมากกว่าถ้วยเปล่า':'')});
['syrup_temp_combine','fp_temp_combine'].forEach(id=>{const t=n(val(id,b));warn(id,b,null,t!==null&&t>10?'ยังสูงกว่า 10 °C · ระบุในสิ่งที่ต่างจากแผน':'')});
['pbt_start','cool_start_time','churn_start'].forEach(start=>{const stop={pbt_start:'pbt_stop',cool_start_time:'time_at_4c',churn_start:'churn_stop'}[start],a=D.timers[key(start,b)],z=D.timers[key(stop,b)];if(z&&(!a||z<a))warn(start==='pbt_start'?'pbt_seconds':start==='cool_start_time'?'cool_total':'churn_minutes',b,null,'เวลาหยุดต้องไม่ก่อนเวลาเริ่ม · แก้เวลาในช่องแก้เวลาด้วยมือ');else warn(start==='pbt_start'?'pbt_seconds':start==='cool_start_time'?'cool_total':'churn_minutes',b,null,'')});
const tt=n(val('temp_taste',b)),r12=val('try12',b)==='ทดลอง',tt12=n(val('temp_taste12',b));warn('temp_taste',b,null,tt!==null&&(tt<-14.5||tt>-13.5)?'เก็บผลไว้ได้ แต่ยังไม่ใช้ตัดสิน H1/H2: อุณหภูมิอยู่นอกช่วง −14.5 ถึง −13.5 °C':'');warn('temp_taste12',b,null,tt12!==null&&(tt12<-12.5||tt12>-11.5)?'ยังไม่ใกล้ −12 °C · จดค่าไว้ประกอบคะแนนสำรอง':'');document.querySelector(`[data-lock="${b}"]`).classList.toggle('hidden',tt!==null);document.querySelector(`[data-rescue-temp="${b}"]`).classList.toggle('hidden',!r12);document.querySelectorAll(`[data-rescue-score="${b}"]`).forEach(el=>el.classList.toggle('hidden',!r12));document.querySelectorAll(`[data-taste][data-batch="${b}"]`).forEach(el=>el.disabled=el.dataset.taste==='12'?!(r12&&tt12!==null):tt===null);document.querySelectorAll(`[data-score-batch="${b}"]`).forEach(el=>el.classList.toggle('locked',el.dataset.gate==='12'?!(r12&&tt12!==null):tt===null));
PEOPLE.forEach(p=>{['s_sweet9','s_like'].forEach(id=>{const v=n(val(id,b,p)),lo=id==='s_sweet9'?1:0,hi=id==='s_sweet9'?9:10;warn(id,b,p,v!==null&&(!Number.isInteger(v)||v<lo||v>hi)?`กรอกจำนวนเต็ม ${lo}–${hi}`:'')})});
for(const [id,out,test] of [['s_scoop14','summary_scoop',v=>v>=-1],['s_sweet','summary_sweet',v=>v>=-1&&v<=1]]){const scores=PEOPLE.map(p=>n(val(id,b,p))).filter(v=>v!==null&&v>=-3&&v<=3&&Number.isInteger(v));setCalc(out,b,null,`${scores.filter(test).length} ใน ${scores.length} คนที่กรอก · ${scores.length===3?'ครบ 3 คน':'ยังไม่ครบ 3 คน'}${tt===null||tt<-14.5||tt>-13.5?' · อุณหภูมิยังไม่พร้อมตีความ':''}`)}}
function syncAll(){const diluted=n(val('syr_brix_diluted'));setCalc('syr_brix',null,null,diluted===null?null:diluted*2,'°Bx');const fruit=n(val('fruit_g_1500')),syr=n(val('syr_g_1500')),water=n(val('water_g_1500'));setCalc('fp_total',null,null,[fruit,syr,water].every(v=>v!==null)?fruit+syr+water:null,'g');const step=n(val('tool_step')),brix=n(val('fp_brix_check'));warn('tool_step',null,null,step!==null&&step!==12?'ไม่ใช่ขั้น 12 → หยุด บอกเล็กก่อน ส่วนน้ำเชื่อมรอบนี้ใช้ไม่ได้':'');warn('fp_brix_check',null,null,brix!==null&&(brix<11.5||brix>12.5)?'นอก 11.5–12.5 °Bx · จดค่าจริงแล้วทำต่อ ไม่แก้เอง':'');warn('syr_brix_diluted',null,null,diluted!==null&&(diluted<0||diluted>50)?'ค่าเจือ 1:1 ต้องอยู่ระหว่าง 0–50 °Bx · ตรวจค่าที่อ่าน':'');BATCHES.forEach(syncBatch);
const entry=BATCHES.map(b=>n(val('entry_temp',b)));const range=entry.every(v=>v!==null)?Math.max(...entry)-Math.min(...entry):null;BATCHES.forEach(b=>{setCalc('entry_spread',b,null,range,'°C');warn('entry_spread',b,null,range!==null&&range>1?'3 ถังต่างกันเกิน 1 °C · จดในสิ่งที่ต่างจากแผนเพื่อใช้ตีความ':'')});
const ors=BATCHES.map(b=>n(val('overrun',b)));const orRange=ors.every(v=>v!==null)?Math.max(...ors)-Math.min(...ors):null;setCalc('or_spread',null,null,orRange);warn('or_spread',null,null,orRange!==null&&orRange>10?'ต่างกันเกิน 10 จุดเปอร์เซ็นต์ · ตีความความแข็ง H1 ด้วยความระวัง':'');PEOPLE.forEach((p,i)=>{const scores=BATCHES.map(b=>n(val('s_sweet9',b,p))),ready=scores.every(v=>v!==null&&Number.isInteger(v)&&v>=1&&v<=9);setCalc('sweet_order',null,p,ready?`${scores.join(' → ')} · ${scores[0]<scores[1]&&scores[1]<scores[2]?'เรียง A < B < C':'ไม่เรียง A < B < C'}`:null);document.querySelectorAll(`[data-person-title="${p}"]`).forEach(el=>el.textContent=`ผู้ชิม ${i+1}${val('taster'+(i+1))?' · '+val('taster'+(i+1)):''}`)});save()}
function save(){D.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(D));document.getElementById('saveState').textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}catch(_){document.getElementById('saveState').textContent='บันทึกในเครื่องไม่ได้ — กรุณาส่งออก JSON'}}
function syncColumnNav(group){const maxScroll=group.scrollWidth-group.clientWidth,index=maxScroll>2&&group.scrollLeft>=maxScroll-2?2:Math.max(0,Math.min(2,Math.round(group.scrollLeft/(group.children[0].getBoundingClientRect().width+14))));document.querySelectorAll(`[data-scroll-target="${group.dataset.columnGroup}"]`).forEach((btn,i)=>btn.setAttribute('aria-current',String(i===index)))}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener(el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{D.values[key(el.dataset.id,el.dataset.batch,el.dataset.person)]=el.value;syncAll()}));document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;if(el.dataset.start&&!D.timers[key(el.dataset.start,b)])return;if(D.timers[key(id,b)])return;D.timers[key(id,b)]=Date.now();beep();render()});document.querySelectorAll('[data-manual]').forEach(el=>{const edit=()=>{const ms=el.value?new Date(el.value).getTime():null;if(ms!==null&&!Number.isFinite(ms))return;D.timers[key(el.dataset.manual,el.dataset.batch)]=ms;syncAll();updateClocks()};el.addEventListener('input',edit);el.addEventListener('change',edit)});document.querySelectorAll('[data-scroll-target]').forEach(btn=>btn.onclick=()=>{const group=document.querySelector(`[data-column-group="${btn.dataset.scrollTarget}"]`),col=group.children[Number(btn.dataset.scrollBatch)];group.scrollTo({left:col.offsetLeft-group.children[0].offsetLeft,behavior:'smooth'})});document.querySelectorAll('[data-column-group]').forEach(group=>group.addEventListener('scroll',()=>syncColumnNav(group)))}
function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>{const start=el.dataset.timer,stop=el.dataset.stop,b=el.dataset.batch,a=D.timers[key(start,b)],z=D.timers[key(stop,b)];el.querySelector('.timer-clock').textContent=clock(start,stop,b);el.querySelector('.help').textContent=`เริ่ม: ${timeText(a)} · หยุด: ${timeText(z)}`;el.querySelector('[data-pair]').disabled=!!a;el.querySelector('[data-start]').disabled=!a||!!z})}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12);o.onended=()=>a.close()}catch(_){}}
function validateImport(x){if(x._form!==FORM||!x.values||Array.isArray(x.values)||typeof x.values!=='object'||!x.timers||Array.isArray(x.timers)||typeof x.timers!=='object')throw Error('invalid');if(Object.entries(x.values).some(([k,v])=>k.length>120||!['string','number','boolean'].includes(typeof v)||typeof v==='number'&&!Number.isFinite(v)))throw Error('invalid values');if(Object.values(x.timers).some(v=>v!==null&&(!Number.isFinite(v)||v<=0||v>8640000000000000)))throw Error('invalid times');return{values:{...empty().values,...x.values},timers:{...x.timers},updated:x.updated||null}}
function normalizeLegacy(d){const shared=['syr_brix','fruit_brix','tool_step','syr_g_1000','water_g_1000','fruit_g_1500','syr_g_1500','water_g_1500','fp_brix_check','tool_note'];shared.forEach(id=>{if(d.values[id]===undefined&&d.values[id+'__A']!==undefined)d.values[id]=d.values[id+'__A']});if(d.values.syr_brix_diluted===undefined&&n(d.values.syr_brix)!==null)d.values.syr_brix_diluted=Number(d.values.syr_brix)/2;return d}
document.getElementById('exportBtn').onclick=()=>{syncAll();const blob=new Blob([JSON.stringify({_form:FORM,_title:TITLE,_schema:2,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=FORM+'-'+(val('date')||'data')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result),next=normalizeLegacy(validateImport(x));if(!confirm('นำเข้าไฟล์ SOR1 นี้แทนข้อมูลปัจจุบัน? ส่งออกข้อมูลปัจจุบันก่อนหากต้องการเก็บไว้'))return;D=next;render();alert(x._schema===2?'นำเข้าข้อมูล SOR1 แล้ว':'นำเข้าข้อมูลเดิมแล้ว · คะแนนชุดรวมของต้นฉบับเก็บใน JSON แต่ไม่แปลงเป็นคะแนนแยกคน กรุณาตรวจและกรอกคะแนน 3 คนใหม่')}catch(_){alert('ไฟล์นี้ใช้กับ SOR1 ไม่ได้ หรือข้อมูลมีรูปแบบไม่ถูกต้อง')}finally{e.target.value=''}};reader.readAsText(file)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูล SOR1 ในเครื่องนี้? ย้อนกลับไม่ได้ กรุณาส่งออก JSON ก่อนหากต้องการเก็บไว้')){D=empty();render()}};
setInterval(updateClocks,1000);render();
})();
</script>
