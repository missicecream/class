<script>
(() => {
'use strict';
const FORM='SOR4',TITLE='SO R4 · มะม่วงขั้น 18 · 3 ระดับหวาน + เชอร์เบท',KEY='missicecream.SOR4.v1';
const BATCHES=['A','B','C','D'];
const RECIPES={
 A:{code:'SONL18',level:'หวานน้อย',inl:20,mtd:20,suc:0,dex:25,water:430,milk:0,syrup:500,mix:1000,rsw:14.6,ts:15.6,afpw:24.5,fp:-1.51,ice:73.2,dexshare:15},
 B:{code:'SONB18',level:'หวานกลาง',inl:20,mtd:20,suc:15,dex:25,water:415,milk:0,syrup:500,mix:1000,rsw:16.7,ts:17.1,afpw:26.8,fp:-1.66,ice:70.9,dexshare:13},
 C:{code:'SONC18',level:'หวานมาก',inl:20,mtd:20,suc:30,dex:25,water:400,milk:0,syrup:500,mix:1000,rsw:18.8,ts:18.6,afpw:29.1,fp:-1.81,ice:68.6,dexshare:12},
 D:{code:'SHDB18',level:'เชอร์เบท · นมสด 215 g',inl:20,mtd:20,suc:15,dex:25,water:200,milk:215,syrup:500,mix:1000,rsw:17.4,ts:19.7,afpw:29,fp:-1.85,ice:67.3,dexshare:12}
};
const LIMITS='ผู้ชิม 1 คน (เล็ก) · n=1 ต่อสูตร · คำตัดสินของผู้เขียน ไม่ใช่สถิติ\nมะม่วงบดแช่แข็งล็อตเดียว · ถ้ามีน้ำตาลเติม ผลไม้จริงต่ำกว่า 45% ให้ดูฉลากประกอบ\nเพคตินและเนื้อของ purée อุตสาหกรรมอาจต่างจากมะม่วงสดปั่น\nไม่มีตัวเทียบขั้น 12 มะม่วงในวันเดียวกัน (D เป็นเชอร์เบท)\nค่าโมเดลอิงมะม่วง 450 g ที่ 15 °Bx และ SYR 77 · ไม่รวมเพคติน/ใยมะม่วง';
const QUESTIONS=[
 ['Q1','ขั้น 18 ตักได้ที่ −14 °C ไหม','ดู A/B/C: ตักได้ทุกถัง → ล็อก 3 ระดับ · ได้เฉพาะ B/C → ใช้ B/C หรือเสิร์ฟ A ที่ −12 °C · ไม่ได้เลย → ทบทวน DEX'],
 ['Q2','เพคตินมะม่วง × v6','หนืดที่ −14 และตอนละลาย: 0–1 ทุกถัง → ไม่พบปัญหาในรอบนี้ · ≥2 → พิจารณาลด INL+MTD หรือปริมาณผลไม้'],
 ['Q3','ระดับหวานที่เหมาะกับมะม่วง 45%','เทียบ A หวานน้อย / B หวานกลาง / C หวานมาก จากความหวาน รสมะม่วง ความชอบ และถังที่เลือก'],
 ['Q4','บริกซ์บน purée ข้น','อ่านจากบันทึก Fruit Part Builder ที่แปะไว้: คนทั่วแล้วครั้งแรกผ่าน ±0.5 °Bx ไหม และถ้าปรับ การเติมครั้งเดียวเข้าเป้าหรือไม่ — ไม่ต้องกรอกตัวเลขซ้ำ'],
 ['Q5','เชอร์เบท D เทียบกับ B','นมสด 215 g (MSNF 1.93%) ช่วยเรื่องตัก เกล็ด เย็นลิ้น บอดี้ และความชอบไหม · มีเม็ดเคซีนตอนรวม/ตอนชิมหรือไม่']
];
let D=load();
const app=document.getElementById('app');
function empty(){return{values:{date:'',operator1:'',operator2:'',taster:'เล็ก',limits:LIMITS},timers:{},updated:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(_){}return empty()}
function key(id,b){return [id,b].filter(Boolean).join('__')}
function val(id,b){return D.values[key(id,b)]??''}
function n(x){if(x===''||x===null||x===undefined)return null;const z=Number(x);return Number.isFinite(z)?z:null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a){return Object.entries(a).map(([k,v])=>` ${k}="${esc(v)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(type==='number'?{step:'0.1',...a}:a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${key(id,b)}"></div></label>`}
function area(id,label,help='',b=null){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}</label>`}
function select(id,label,opts,help='',b=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}</label>`}
function calc(id,label,b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${key(id,b)}">—</div><div class="warning" data-warn="${key(id,b)}"></div></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function timeText(ms){return ms?new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=x=>String(x).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function seconds(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)];return a&&z&&z>=a?(z-a)/1000:null}
function clock(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)],s=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0;return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function timer(start,stop,label,b,startText,stopText){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}"${D.timers[key(start,b)]?' disabled':''}>${startText}</button><button class="btn amber" type="button" data-stamp="${stop}" data-start="${start}" data-batch="${b}"${!D.timers[key(start,b)]||D.timers[key(stop,b)]?' disabled':''}>${stopText}</button></div><div class="help">เริ่ม: ${timeText(D.timers[key(start,b)])} · หยุด: ${timeText(D.timers[key(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${[start,stop].map((id,i)=>`<label>${i?'หยุด':'เริ่ม'}<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label>`).join('')}</div></details></div>`}
function stamp(id,label,b){return `<div class="field"><span>${label}</span><button class="btn" type="button" data-stamp="${id}" data-batch="${b}"${D.timers[key(id,b)]?' disabled':''}>บันทึกเวลาตอนนี้</button><label class="help">เวลาที่บันทึก / แก้ไข<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label></div>`}
function recipe(b){const x=RECIPES[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.level}</p><ul><li>ส่วนผลไม้มะม่วง 500 g</li><li>SER 3 + XTG 1 + INL 20 + MTD 20 + เกลือ 1 g</li><li>น้ำตาลทราย ${x.suc} + เดกซ์โทรส 25 + น้ำ ${x.water} g</li><li>นมสด ${x.milk} g${b==='D'?' · เติมเมื่อ ~60 °C':' · ไม่ใส่นม'}</li><li>ส่วนน้ำเชื่อม 500 g</li></ul><div class="facts">RSW ${x.rsw} · TS ${x.ts}% · AFPW ${x.afpw} · FP ${x.fp} °C · น้ำแข็งที่ −14 °C ${x.ice}% · DEX share ${x.dexshare}%<br>MSNF ${b==='D'?'1.93':'0'}% · ไขมัน ${b==='D'?'0.81':'0'}%</div><div class="total">มิกซ์ตามสูตร 1,000 g</div></article>`}
function production(b){const x=RECIPES[b];return `<div class="batch-column">
<section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${BATCHES.indexOf(b)+1}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.level} · กรอกจากบนลงล่าง</p></section>
<section class="screen">

function syncTaste(b){const t=n(val('temp_taste',b)),ready=t!==null;warn('temp_taste',b,ready&&(t<-14.5||t>-13.5)?'อุณหภูมิอยู่นอก −14.5 ถึง −13.5 °C · เก็บคะแนนได้ แต่ต้องระบุข้อจำกัด':'');const lock=document.querySelector(`[data-lock="${b}"]`);if(lock)lock.classList.toggle('hidden',ready);document.querySelectorAll(`[data-taste][data-batch="${b}"]`).forEach(el=>el.disabled=!ready);document.querySelectorAll(`[data-score-batch="${b}"]`).forEach(el=>el.classList.toggle('locked',!ready));[['s_scoop14','summary_scoop'],['s_hard','summary_hard'],['s_sticky','summary_sticky'],['s_sticky_melt','summary_sticky_melt'],['s_body','summary_body'],['s_icy','summary_icy'],['s_like','summary_like']].forEach(([id,out])=>setCalc(out,b,val(id,b)))}

document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=validateImport(JSON.parse(reader.result));if(!confirm('นำเข้าไฟล์ SOR4 นี้แทนข้อมูลปัจจุบัน? ส่งออกข้อมูลปัจจุบันก่อนหากต้องการเก็บไว้'))return;D=next;render();alert('นำเข้าข้อมูล SOR4 แล้ว')}catch(_){alert('ไฟล์นี้ใช้กับ SOR4 ไม่ได้ หรือข้อมูลมีรูปแบบไม่ถูกต้อง')}finally{e.target.value=''}};reader.readAsText(file)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูล SOR4 ในเครื่องนี้? ย้อนกลับไม่ได้ กรุณาส่งออก JSON ก่อนหากต้องการเก็บไว้')){D=empty();render()}};
setInterval(updateClocks,1000);render();
})();
</script>
</body>
</html>
