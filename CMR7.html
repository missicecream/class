<body>
<header><div class="wrap"><a class="back" href="index.html">← กลับหน้าหลัก</a><h1>CM R7 · Corrected Coconut + Ice Ceiling</h1><p>3 ถัง · CMDL12 → CMDL09 → CMNL11 · ถังละ 2,000 g · Frigomat G10</p><div class="statusline"><div class="progress"><i id="progress"></i></div><span class="save-state" id="saveState">บันทึกอัตโนมัติ</span></div></div></header>
<main class="wrap"><div id="app"></div><div class="toolbar no-print"><button class="btn" type="button" onclick="document.getElementById('importFile').click()">📂 นำเข้า JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn danger" id="resetBtn" type="button">ล้างข้อมูล</button></div></main>
<footer>CM R7 · MR v8.8.0 · สูตรหลังแก้ค่ากะทิ · ข้อมูลเก็บในเครื่องนี้</footer>
<script>
(() => {
'use strict';
const C={
 file:'CMR7',title:'CM R7 · สูตรหลังแก้ค่ากะทิ + ตั้งเพดานน้ำแข็ง',purpose:'ตรวจว่าสูตรที่แก้ค่าของแข็งกะทิแล้วหายหยาบหรือไม่ ทดสอบสูตรตรงกลางสำหรับห้องเรียน และเก็บ Scoopability ที่ −14 °C เพื่อเริ่มตั้งเพดานน้ำแข็งของหมวดกะทิ',
 critical:'กรัมเปลี่ยนหมดทุกตัว — ห้ามใช้ใบงาน R6 · ทำทีละถัง A → B → C ห้ามสลับ · ถัง B ต่างทั้งสูตรและการพาสเจอร์ไรส์ จึงแยกผลสองปัจจัยนี้ออกจากกันไม่ได้',
 batches:{
  A:{code:'CMDL12',summary:'สูตรแก้แล้วของ R6-B · Fat 12.01% · TS 30.99%',facts:'RSW 12.75 · น้ำแข็ง 599 g/kg · CCM 560 g/kg',cream:true,formula:['① SEP 10 + SUC 76 + WTR 412 → 65 °C','② PMP 40 + DEX 96 + INL 60 + MTD 66 + SLT 2 + CCM 1,120','③ CRM 118 ที่ ≤10 °C']},
  B:{code:'CMDL09',summary:'สูตรตรงกลาง · ตัวเต็งสูตรห้องเรียน · Fat 8.99% · TS 29.50%',facts:'RSW 12.73 · น้ำแข็ง 611 g/kg · CCM 420 g/kg · พาสเจอร์ไรส์กะทิ',cream:true,formula:['① SEP 10 + SUC 78 + WTR 682 → 65 °C','② PMP 50 + DEX 96 + INL 60 + MTD 100 + SLT 2 + CCM 840','③ CRM 82 ที่ ≤10 °C']},
  C:{code:'CMNL11',summary:'สูตรแก้แล้วของ R6-C · Fat 11.00% · TS 29.83%',facts:'RSW 12.77 · น้ำแข็ง 619 g/kg · ไขมันกะทิ 10.68%',cream:false,formula:['① SEP 10 + SUC 78 + WTR 398 → 65 °C','② DEX 96 + INL 60 + MTD 100 + SLT 2 + CCM 1,256','③ ไม่มีครีม']}
 },
 limits:['n = 1 ถังต่อสูตร · ผู้ชิมคนเดียว ไม่มีนัยทางสถิติ','ค่ากะทิยังมาจากตำรา ไม่ใช่ค่าที่วัดจากกะทิจริง ตัวเลข TS/RSW/น้ำแข็งจึงอาจเลื่อน','เทียบ R6 เป็นการเทียบข้ามรอบ ต้องดู %OR และอุณหภูมิตอนดึงออกประกอบ','ถัง B ต่างพร้อมกันทั้งสูตรและการพาสเจอร์ไรส์ จึงตอบได้เพียงว่าใช้ได้ในภาพรวมหรือไม่']
};
const BATCHES=['A','B','C'],KEY='missicecream.'+C.file+'.v1';let D=load();
const app=document.getElementById('app'),saveState=document.getElementById('saveState'),progress=document.getElementById('progress');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(e){}return{values:{date:'',operator:'',taster:'เล็ก'},timers:{},updated:null}}
function save(){D.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(D));saveState.textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});progress.style.width=Math.min(100,Object.values(D.values).filter(v=>v!==''&&v!==false).length/1.35)+'%'}
function k(id,b){return b?id+'__'+b:id}function val(id,b){return D.values[k(id,b)]??''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a={}){return Object.entries(a).map(([x,y])=>y===null||y===undefined?'':` ${x}="${esc(y)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function area(id,label,help='',b=null,a={}){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}${attrs(a)}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function select(id,label,opts,help='',b=null,a={}){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}${attrs(a)}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function check(id,label,help=''){return `<label class="check"><input type="checkbox" data-id="${id}"${val(id)?' checked':''}><span>${label}${help?`<small class="help">${help}</small>`:''}</span></label>`}
function calc(id,label,unit='',b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${k(id,b)}">${val(id,b)!==''?esc(val(id,b))+(unit?' '+unit:''):'—'}</div><div class="warning" data-warn="${id}" data-batch="${b||''}"></div></div>`}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function timeText(ms){return ms?new Date(ms).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'medium'}):'—'}
function duration(start,stop,b){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)];return a&&z&&z>=a?(z-a)/60000:null}
function clock(start,stop,b,mode='up'){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)],sec=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0,t=mode==='down'?Math.max(0,1800-sec):sec;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function manual(id,label,b){return `<label>${label}<input type="datetime-local" data-manual="${id}" data-batch="${b}" value="${esc(toLocal(D.timers[k(id,b)]))}"></label>`}
function timer(start,stop,label,b,mode='up'){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}" data-mode="${mode}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b,mode)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}">เริ่ม</button><button class="btn amber" type="button" data-stamp="${stop}" data-batch="${b}">หยุด</button></div><div class="help">เริ่ม: ${timeText(D.timers[k(start,b)])} · หยุด: ${timeText(D.timers[k(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual(start,'เริ่ม',b)}${manual(stop,'หยุด',b)}</div></details></div>`}
function coolingTimer(b){const cream=C.batches[b].cream,mid=D.timers[k('time_at_10c',b)];return `<div class="timer" data-timer="cool_start" data-stop="cool_end" data-batch="${b}" data-mode="up"><div class="timer-label">Cooling ถึง 4 °C</div><div class="timer-clock">${clock('cool_start','cool_end',b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="cool_start" data-pair="cool_end" data-batch="${b}">เริ่มลงอ่าง</button><button class="btn amber" type="button" data-stamp="cool_end" data-batch="${b}">ถึง 4 °C</button></div>${cream?`<div class="marker"><button class="btn" type="button" data-stamp="time_at_10c" data-batch="${b}">ถึง 10 °C — เติมครีม</button><div class="help">เวลาที่กด: ${timeText(mid)}</div></div>`:''}<div class="help">เริ่ม: ${timeText(D.timers[k('cool_start',b)])} · ถึง 4 °C: ${timeText(D.timers[k('cool_end',b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual('cool_start','เริ่ม',b)}${cream?manual('time_at_10c','ถึง 10 °C',b):''}${manual('cool_end','ถึง 4 °C',b)}</div></details></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function formulaCard(b){const x=C.batches[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.summary}</p><ul>${x.formula.map(y=>`<li>${y}</li>`).join('')}</ul><div class="facts">${x.facts}</div><div class="total">รวม 2,000 g</div></article>`}
function pasteurSection(){return `<section class="screen pasteur"><div class="eyebrow">ทำก่อนเริ่มละลาย SEP · ถัง B เท่านั้น</div><h2>🔥 พาสเจอร์ไรส์กะทิ 840 g</h2><div class="callout danger"><b>ปิดฝาสนิท</b> · Water bath เริ่มที่ 71 °C · เริ่มจับ 30 นาทีเมื่อกะทิถึง 70 °C · ระหว่างถือห้ามต่ำกว่า 70 °C · หลังจบเติมน้ำคืนให้กะทิครบ 840 g แล้วลดลงมาประมาณ 55 °C</div><div class="pasteur-grid">${field('past_weight_before','น้ำหนักกะทิ + ภาชนะ ก่อน (g)','','number','B',{step:'0.1'})}${field('past_bath_temp','อุณหภูมิ Water bath ที่ตั้งจริง (°C)','71 °C หรือค่าที่ปรับ','number','B',{step:'0.1'})}${field('past_time_reach70','เวลาที่กะทิใช้กว่าจะถึง 70 °C (นาที)','','number','B',{step:'0.1'})}<div class="wide">${timer('past_start','past_stop','ถือกะทิ ≥70 °C นานอย่างน้อย 30 นาที','B')}</div>${calc('past_minutes','เวลาถือจริง','นาที','B')}${field('past_temp_min','อุณหภูมิกะทิต่ำสุดระหว่างถือ (°C)','ต้อง ≥70 °C','number','B',{step:'0.1'})}${field('past_weight_after','น้ำหนักกะทิ + ภาชนะ หลัง (g)','','number','B',{step:'0.1'})}${field('past_water_added','น้ำที่เติมคืน (g)','เติมให้กะทิกลับมาครบ 840 g','number','B',{step:'0.1'})}${select('past_look','ลักษณะกะทิหลังพาสเจอร์ไรส์',['เนียนดี','แยกชั้น','มีน้ำมันลอย','เป็นก้อน'],'','B')}${select('past_smell','กลิ่นกะทิหลังพาสเจอร์ไรส์',['สดเหมือนเดิม','หอมขึ้น','มีกลิ่นต้มเล็กน้อย','กลิ่นต้มชัด'],'ดมก่อนผสม','B')}<div class="wide">${area('past_note','บันทึกเพิ่ม','','B')}</div></div></section>`}
function batchColumn(b){const x=C.batches[b];return `<div class="batch-column"><section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${b==='A'?'1':b==='B'?'2':'3'} · คอลัมน์ ${b}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.summary} · กรอกจากบนลงล่าง</p></section><section class="screen">${stage('1 · ต้ม SEP · อุ่นมิกซ์ · PBT',select('sep_dissolve','สารคงตัวละลายหมดไหม',['เนียนดี','มีเม็ดเล็กน้อย','เป็นเม็ดสาคูชัด'],'SEP + น้ำตาล + น้ำ → 65 °C',b)+`<div class="callout"><b>รวมมิกซ์ → 55 °C</b> · แล้วยกลงทันที</div>`+field('temp_pbt_start','อุณหภูมิในโถตอนเริ่ม PBT (°C)','เป้า ≥45 °C','number',b,{step:'0.1'})+`<div class="callout"><b>PBT 3 รอบ</b> · รอบละ 30 วินาที · พัก 10 วินาที</div>`+field('temp_pbt_end','อุณหภูมิจบ PBT (°C)','เป้า ≥40 °C','number',b,{step:'0.1'})+select('pbt_note','ลักษณะมิกซ์หลัง PBT',['เนียนดี','มีฟองมาก','เห็นเม็ดไขมัน','อื่นๆ'],'',b))}${stage('2 · Cooling',coolingTimer(b)+calc('cool_total','เวลา Cooling รวม','นาที',b)+field('cool_lowest','อุณหภูมิต่ำสุดที่ทำได้ (°C)','เป้า ≤4 °C','number',b,{step:'0.1'}),'อ่างน้ำแข็ง + overhead stirrer · เป้า 4 °C ภายในไม่เกิน 60 นาที')}${stage('3 · บ่มสั้น 30 นาที',timer('age_start','age_stop','นับถอยหลังบ่ม 30 นาที',b,'down')+calc('age_minutes','เวลาบ่มจริง','นาที',b),'บ่มที่ 0–4 °C')}${stage('4 · เทลงเครื่องและปั่น',field('cup_empty','น้ำหนักถ้วยเปล่า (g)','','number',b,{step:'0.1'})+field('cup_mix','น้ำหนักถ้วย + มิกซ์ ไม่มีฟอง (g)','ตักส่วนที่ไม่มีฟอง','number',b,{step:'0.1'})+field('entry_temp','อุณหภูมิมิกซ์ตอนเทเข้าเครื่อง (°C)','บันทึกค่าจริง','number',b,{step:'0.1'})+timer('churn_start','churn_stop','จับเวลาปั่น',b)+select('machine_stop_type','เครื่องหยุดเพราะ',['หยุดปกติ','ตัด overload','กดหยุด'],'',b))}${stage('5 · ปั่นเสร็จ · %OR',field('draw_temp','อุณหภูมิตอนปั่นเสร็จ (°C)','บันทึกค่าจริง','number',b,{step:'0.1'})+field('cup_ic_1','น้ำหนักถ้วย + ไอศกรีม ครั้งที่ 1 (g)','เท ไม่ตัก','number',b,{step:'0.1'})+field('cup_ic_2','น้ำหนักถ้วย + ไอศกรีม ครั้งที่ 2 (g)','เท ไม่ตัก · ต่างจากครั้งแรกเกิน 3 g ต้องชั่งใหม่','number',b,{step:'0.1'})+calc('ic_repeat','ตรวจการชั่ง 2 ครั้ง','',b)+calc('ic_net','น้ำหนักไอศกรีมสุทธิที่ใช้','g',b)+calc('or_pct','%OR','%',b)+select('texture_after','เนื้อตอนปั่นเสร็จ',['แห้งปกติ','แห้งเงาสวยมาก','น้ำซึมเล็กน้อย','เหลวผิดปกติ'],'',b)+area('deviation','เบี่ยงเบนจากสเปกทั้งหมด','ถ้าไม่มีให้เขียนว่า “ไม่มี”',b),'ถ้าสองครั้งต่างกัน ≤3 g ใช้ค่าเฉลี่ย · ถ้าเกิน 3 g ระบบหยุดคำนวณและให้ชั่งใหม่')}</section></div>`}
function score(id,label,min,max,help,b=null,gate=false){const locked=gate&&!val('temp_taste',b),a={min,max,step:'1'};if(gate)a['data-taste']='1';if(locked)a.disabled='';if(max===10)return `<div class="score-field">${field(id,label,'กรอกคะแนน 0–10','number',b,a)}</div>`;const vs=Array.from({length:max-min+1},(_,i)=>min+i),cls=vs.length===4?'scale scale4':'scale',taste=gate?' data-taste="1"':'';return `<div class="field score-field"><span>${label}</span><div class="${cls}">${vs.map(v=>`<label><input type="radio" name="${k(id,b)}" data-id="${id}"${b?` data-batch="${b}"`:''}${taste} value="${v}"${String(val(id,b))===String(v)?' checked':''}${locked?' disabled':''}><span>${v>0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small><div class="warning" data-warn="${id}" data-batch="${b||''}"></div></div>`}

function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>el.querySelector('.timer-clock').textContent=clock(el.dataset.timer,el.dataset.stop,el.dataset.batch,el.dataset.mode))}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function exportJSON(){const blob=new Blob([JSON.stringify({_form:C.file,_title:C.title,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=C.file+'-'+(D.values.date||'data')+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x._form!==C.file||!x.values||!x.timers)throw 0;D={values:x.values,timers:x.timers,updated:x.updated||null};save();render();alert('นำเข้าข้อมูลแล้ว')}catch(_){alert('ไฟล์นี้ใช้กับแบบฟอร์ม CMR7 ไม่ได้')}};r.readAsText(f)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดของ CMR7? การทำงานนี้ย้อนกลับไม่ได้')){localStorage.removeItem(KEY);location.reload()}};
setInterval(()=>{updateClocks();const timers=[['age_start','age_stop','A'],['age_start','age_stop','B'],['age_start','age_stop','C'],['past_start','past_stop','B']];timers.forEach(([start,stop,b])=>{const a=D.timers[k(start,b)],z=D.timers[k(stop,b)];if(a&&!z&&Math.floor((Date.now()-a)/1000)===1800)beep()})},1000);
render();
})();
</script>
