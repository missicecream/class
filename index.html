<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss Icecream · Lab Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4ECE0;
    --card: #FBF6EC;
    --ink: #2B1F15;
    --muted: #8C7A66;
    --muted-soft: #BFB09B;
    --line: #E5D9C4;
    --line-soft: #EFE5D2;
    --accent: #6B8E4E;
    --accent-deep: #4F6B3A;
    --rose-deep: #A85B47;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    padding: 56px 20px 56px;
    background-image:
      radial-gradient(circle at 15% 5%, rgba(220, 229, 200, 0.50) 0%, transparent 40%),
      radial-gradient(circle at 88% 95%, rgba(201, 120, 98, 0.10) 0%, transparent 40%);
  }

  .container { max-width: 720px; margin: 0 auto; }

  /* Header */
  header { text-align: center; margin-bottom: 40px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 500;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(34px, 5.5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent-deep);
    font-weight: 400;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.65;
  }

  /* Tool list */
  .tools {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .tool-card {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px;
    text-decoration: none;
    color: var(--ink);
    transition: all 0.22s ease;
    box-shadow: 0 4px 24px -18px rgba(43, 31, 21, 0.18);
  }

  .tool-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px -18px rgba(43, 31, 21, 0.3);
  }

  .tool-num {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 30px;
    color: var(--muted-soft);
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }

  .tool-body { flex: 1; }

  .tool-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .tool-title em {
    font-style: italic;
    color: var(--accent-deep);
  }

  .tool-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }

  .tool-arrow {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--muted-soft);
    flex-shrink: 0;
    transition: transform 0.22s ease, color 0.22s ease;
  }

  .tool-card:hover .tool-arrow {
    color: var(--accent-deep);
    transform: translateX(4px);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-family: 'Fraunces', serif;
    font-style: italic;
    padding: 40px 0;
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 44px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.8;
  }

  footer .brand {
    font-size: 10.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted-soft);
  }

  @media (max-width: 480px) {
    body { padding: 36px 14px 44px; }
    .tool-card { padding: 18px 18px; gap: 12px; }
    .tool-num { font-size: 24px; width: 30px; }
    .tool-title { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="container">

    <header>
      <div class="eyebrow">Miss Icecream · Lab Tools</div>
      <h1>เครื่องมือ <em>ทั้งหมด</em></h1>
      <p class="subtitle">รวมเครื่องมือคำนวณสำหรับงานไอศกรีม เลือกเปิดได้จากรายการด้านล่างนะคะ</p>
    </header>

    <div class="tools" id="tools"></div>

    <footer>
      <p class="brand">Miss Icecream</p>
    </footer>

  </div>

<script>
  // เพิ่มไฟล์ใหม่ได้โดยเพิ่มรายการในนี้
  const tools = [
    {
      file: 'PST-PSS-Log.html',
      title: 'PST &amp; PSS <em>Log</em>',
      desc: 'บันทึกเวลา-อุณหภูมิขั้นตอน PST/PSS · คำนวณ %Overrun · กราฟ · รายงาน PDF A4 (สำหรับเก็บผลทดลอง)'
    },
    {
      file: 'CMR2.html',
      title: 'CM R2 <em>Process Log</em>',
      desc: 'บันทึกผลทดลอง 5 ถัง A–E · จับเวลา Setting · ตรวจอุณหภูมิ · คำนวณ %Overrun · Blind tasting'
    },
    {
      file: 'CMR3.html',
      title: 'CM R3 <em>Factorial Log</em>',
      desc: 'บันทึกทดลอง SEP แยก/รวม × ครีมก่อน/หลัง · กรอก %Overrun ตาม Timeline ก่อนและหลังปั่น · วิเคราะห์ H1–H7'
    },
    {
      file: 'CMR4.html',
      title: 'CM R4 <em>CMDL10 vs CMDL11</em>',
      desc: 'สูตร TS32 ใหม่ · เทียบ fat 10 กับ fat 11 · แยกละลาย SEP · PBT · Cooling 4°C + บ่ม 30 นาที · Blind tasting'
    },
    {
      file: 'CMR5.html',
      title: 'CM R5 <em>D &amp; N · INL→MTD</em>',
      desc: '4 สูตรใสสุด+ข้นสุดของสาย D/N · INL≤20 + MTD · TS32 · PBT · %Overrun · Blind tasting'
    },
    {
      file: 'MKR13.html',
      title: 'MK R13 <em>INL 3% vs 4%</em>',
      desc: '4 Batch · MKDB08 คู่เทียบ INL/MTD · MKDL05 สูตรรื้อนม · CHB10 สูตรใหม่ CHC · PBT · %Overrun · Blind tasting'
    },
    {
      file: 'MKR15.html',
      title: 'MK R15 <em>Load 1.0 vs 1.3 kg</em>',
      desc: 'MKDB08 สูตรเดียวกัน 2 ถัง · ทดสอบโหลด Frigomat G5 · จับเวลาปั่น · probe/FWT · %Overrun · เนื้อตอนดึงออก'
    },
    {
      file: 'MKR16.html',
      title: 'MK R16 <em>RSW 15/17 + CH Balance</em>',
      desc: '4 ถัง · A–C บน G5 + ช็อกโกแลต D บน G10 2 kg · SER/Cooling/บ่ม/ปั่น Timer · overhead stirrer · ชิมวันปั่น/2/4 สัปดาห์'
    },
    {
      file: 'MKR17.html',
      title: 'MK R17 <em>Airflow Confirmation</em>',
      desc: '2 ถัง · MKDL05 ทำซ้ำ + MKDC14 stress test บน G5 · วัด intake/room/exhaust · ทดสอบตีอากาศ · %Overrun · ปริมาตรสุดท้าย · การละลาย'
    },
    {
      file: 'MKR18.html',
      title: 'MK R18 <em>G5 vs G10</em>',
      desc: 'MKDL05 สูตรเดียว · G10 2 kg และ G5 1 kg เป็น 2 คอลัมน์ batch ขนานกัน · กรอกตามลำดับผลิตจริง · ชั่งมิกซ์ก่อนปั่นและไอศกรีมหลังปั่น 2 รอบเพื่อหา %Overrun'
    },
    {
      file: 'MKR19.html',
      title: 'MK R19 <em>RSW 17/19 on G10</em>',
      desc: 'MKDB05 → MKDC14 · G10 ถังละ 2 kg · 2 คอลัมน์ batch ขนาน · overhead stirrer · %Overrun + ปริมาตร · ชิมทันที/วันถัดไป · การละลาย'
    },
    {
      file: 'CHR1.html',
      title: 'CH R1 <em>PST Rest-Time</em>',
      desc: 'ทดลองเบสช็อกโกแลต CHB10 · เทียบ PST 30/60×3 กับ 30/10×3 · จับเวลา · %Overrun · Blind tasting'
    },
    {
      file: 'SOYR1.html',
      title: 'Soy R1 <em>D-line · 3 Brands</em>',
      desc: 'เบสถั่วเหลืองสายครีม 4 Batch · เทียบ SY/SV/SL และใส↔ข้น · จับตา panna cotta · เลือกน้ำหนักรวมถ้วยหรือสุทธิ · %Overrun · Blind tasting'
    },
    {
      file: 'SOYR2.html',
      title: 'Soy R2 <em>N-line · 3 Brands</em>',
      desc: 'เบสถั่วเหลืองสายเจ 4 Batch · น้ำมันมะพร้าว · PBT 3 รอบ · Cooling ถึง 4 C · เทียบ SY/SV/SL และ D-line จาก R1 · เลือกน้ำหนักรวมถ้วยหรือสุทธิ · %Overrun · Blind tasting'
    },
    {
      file: 'YYR1.html',
      title: 'YY R1 <em>Yolida · INL30 + MTD10</em>',
      desc: '2 ถัง · YYDL05 → YYDL09 · G10 ถังละ 2 kg · ฟอร์มทีละช่วงงาน · PBT · Cooling · บ่ม 30 นาที · %Overrun · ชิมสัปดาห์ 0/4/12'
    },
    {
      file: 'YDR2.html',
      title: 'YD R2 <em>Dutchie · INL30 + MTD10</em>',
      desc: '2 ถัง · YDDL05 → YDDL09 · แยกเดกซ์โทรส 2 ถ้วย · G10 ถังละ 2 kg · ฟอร์มทีละช่วงงาน · %Overrun · ชิมสัปดาห์ 0/4/12'
    },
    {
      file: 'GKR1.html',
      title: 'GK R1 <em>Greek Yogurt · Cooling Feasibility</em>',
      desc: '3 ถัง · GMDL05 → GDDL07 → GDDL09 · G10 ถังละ 2 kg · Cooling ด้วย overhead stirrer · บันทึกฟองจาก PBT · %Overrun · ชิมสัปดาห์ 0/4/12'
    }
  ];

  const wrap = document.getElementById('tools');

  if (tools.length === 0) {
    wrap.innerHTML = '<div class="empty">ยังไม่มีเครื่องมือในขณะนี้</div>';
  } else {
    tools.forEach((t, i) => {
      const a = document.createElement('a');
      a.className = 'tool-card';
      a.href = t.file;
      a.innerHTML = `
        <div class="tool-num">${i + 1}</div>
        <div class="tool-body">
          <div class="tool-title">${t.title}</div>
          <div class="tool-desc">${t.desc}</div>
        </div>
        <div class="tool-arrow">→</div>
      `;
      wrap.appendChild(a);
    });
  }
</script>
<div class="site-footer" style="margin:30px auto 0;max-width:760px;padding:14px 16px 4px;border-top:1px solid var(--line,#E5D9C4);text-align:center;font-size:12px;color:var(--muted,#8C7A66);line-height:1.7">Copyright © 2026 Miss Icecream Co., Ltd. All Rights Reserved. · <a href="/class/license.html" style="color:inherit;text-decoration:underline">เงื่อนไขการใช้งาน</a><br><span style="font-size:11.5px">เครื่องมือสงวนสิทธิ์สำหรับนักเรียนในคลาสอาจารย์พรหล้า ขาวเธียร</span></div>
</body>
</html>
