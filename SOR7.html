<body>
<header><div class="wrap"><a class="back" href="index.html">← กลับหน้าหลัก</a><h1>SO R7 · เชอร์เบตน้ำมะพร้าว · บันได MSNF</h1><p>ระดับ B · ขั้น 12 · สูตร v7 · G5 · A → B → C · เล็กชิมคนเดียว · 6 คะแนนต่อถัง</p><div class="statusline"><span class="save-state" id="saveState" role="status">บันทึกอัตโนมัติในเครื่องนี้</span></div></div></header>
<main class="wrap"><div id="app"></div>
  <div class="callout warn no-print" id="completionStatus" role="status"></div>
  <div class="toolbar no-print">
    <button class="btn primary" id="exportBtn" type="button">💾 ส่งออก JSON ฉบับสมบูรณ์</button>
    <button class="btn" id="draftBtn" type="button">บันทึก JSON ฉบับร่าง</button>
    <button class="btn" id="importBtn" type="button">📂 นำเข้า JSON</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button class="btn" type="button" onclick="window.print()">🖨 พิมพ์ / PDF</button>
    <button class="btn danger" id="resetBtn" type="button">ล้างข้อมูล</button>
  </div>
</main>
<footer>07SO-LabRecord-R7 v1 + LabTeam-R7 v2 · 8 ต.ค. 2569 · นม 2 สายทุกถัง · CY 0.5 g หลังบ่ม · รูป Bleeding เก็บแยกจาก JSON</footer>
<script>
(() => {
'use strict';
const FORM='SOR7',TITLE='SO R7 · เชอร์เบตน้ำมะพร้าว · บันได MSNF',KEY='missicecream.SOR7.v1';
const BATCHES=['A','B','C'];
const RECIPES={
 A:{code:'MSNF 1.94%',level:'นมสดล้วน · ไม่มี PMP',ser:6,inl:20,mtd:20,suc:9,dex:71,dex1:21,dex2:50,water:158,milk:215,pmp:0,line1:194,line2:306,syrup:500,mix:1000},
 B:{code:'MSNF 3.53%',level:'PMP 17 g · ระดับกลาง',ser:6,inl:20,mtd:20,suc:25,dex:45,dex1:5,dex2:40,water:151,milk:215,pmp:17,line1:187,line2:313,syrup:500,mix:1000},
 C:{code:'MSNF 5.03%',level:'PMP 33 g · ระดับสูง',ser:6,inl:20,mtd:20,suc:42,dex:18,dex1:0,dex2:18,water:145,milk:215,pmp:33,line1:193,line2:307,syrup:500,mix:1000}
};
const LIMITS='ผู้ชิม 1 คน (เล็ก) · n=1 ต่อสูตร · ไม่ใช่สถิติ\nน้ำมะพร้าวรสอ่อน ผลเรื่องนมกลบรสใช้กับผลไม้รสจัดตรงๆ ไม่ได้\nCY 0.5 g ทุกถังช่วยเสริมรสมะพร้าวเท่ากัน\nA ใช้นมสดล้วน ไม่มีนมผง จึงไม่ได้แยกผลนมผงจากระดับ MSNF ในถังนั้น';
const QUESTIONS=[
 ['Q1','MSNF เพิ่มแล้วเนื้อดีขึ้นไหม · A → B → C','ดูบอดี้ เกล็ด แตกร่วน หนืด %OR และความชอบ → เลือกระดับ MSNF ของเล่ม'],
 ['Q2','นมกลบรสมะพร้าวที่ระดับไหน','ดูความชัดของกลิ่นรสมะพร้าวและ note รสนม/นมผง → เพดาน MSNF สำหรับผลไม้รสอ่อน'],
 ['Q3','หวานและแข็งเท่ากันจริงไหม','ดู note ความหวาน การตักที่ −14 °C และอุณหภูมิปั่นเสร็จ → ยืนยันหรือทบทวนตัวคุม RSW / FWT'],
 ['Q4','Bleeding และรูปทรงละลาย','อ่านผลหลัง 20 นาทีของแต่ละถัง พร้อมรูป 3 ถ้วย → ข้อมูลอ้างอิงตำหนิ'],
 ['Q5','pH มิกซ์เชอร์เบตน้ำมะพร้าว','วัดหลังคนที่ประมาณ 20 °C พร้อมอุณหภูมิจริง → ฐานเทียบ R8']
];
let D=load();
const app=document.getElementById('app');
function empty(){return{values:{date:'',operator1:'',operator2:'',taster:'เล็ก',limits:LIMITS},timers:{},updated:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(_){}return empty()}
function key(id,b){return [id,b].filter(Boolean).join('__')}
function val(id,b){return D.values[key(id,b)]??''}
function n(x){if(x===''||x===null||x===undefined)return null;const z=Number(x);return Number.isFinite(z)?z:null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a){return Object.entries(a).map(([k,v])=>` ${k}="${esc(v)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(type==='number'?{step:'0.1',...a}:a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${key(id,b)}"></div></label>`}
function area(id,label,help='',b=null){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}</label>`}
function select(id,label,opts,help='',b=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}><option value="">— เลือก —</option>${opts.map(x=>{const [value,text]=Array.isArray(x)?x:[x,x];return `<option value="${esc(value)}"${String(val(id,b))===String(value)?' selected':''}>${esc(text)}</option>`}).join('')}</select>${help?`<small class="help">${help}</small>`:''}</label>`}
function calc(id,label,b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${key(id,b)}">—</div><div class="warning" data-warn="${key(id,b)}"></div></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function timeText(ms){return ms?new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=x=>String(x).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function seconds(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)];return a&&z&&z>=a?(z-a)/1000:null}
function clock(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)],s=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0;return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function timer(start,stop,label,b,startText,stopText){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}"${D.timers[key(start,b)]?' disabled':''}>${startText}</button><button class="btn amber" type="button" data-stamp="${stop}" data-start="${start}" data-batch="${b}"${!D.timers[key(start,b)]||D.timers[key(stop,b)]?' disabled':''}>${stopText}</button></div><div class="help">เริ่ม: ${timeText(D.timers[key(start,b)])} · หยุด: ${timeText(D.timers[key(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${[start,stop].map((id,i)=>`<label>${i?'หยุด':'เริ่ม'}<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label>`).join('')}</div></details></div>`}
function stamp(id,label,b){return `<div class="field"><span>${label}</span><button class="btn" type="button" data-stamp="${id}" data-batch="${b}"${D.timers[key(id,b)]?' disabled':''}>บันทึกเวลาตอนนี้</button><label class="help">เวลาที่บันทึก / แก้ไข<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label></div>`}
function recipe(b){const x=RECIPES[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.level}</p><ul><li><b>สาย ①</b> SER 6 + SUC ${x.suc} + DEX ${x.dex1} + น้ำ ${x.water} g</li><li><b>สาย ②</b> INL 20 + MTD 20 + เกลือ 1 + PMP ${x.pmp} + DEX ${x.dex2} + นมสด 215 g</li><li>DEX รวม ${x.dex} g · ชั่งแยกสองสาย</li><li>ส่วนผลไม้ Chaba + SYR จากเว็บ 500 g</li></ul><div class="facts">สาย ① ${x.line1} + สาย ② ${x.line2} = ฐาน 500 g</div><div class="total">ฐาน 500 + ส่วนผลไม้ 500 = มิกซ์ 1,000 g</div><p class="sub"><b>CY 0.5 g หลังบ่ม</b> · ไม่นับในสูตร · ไม่ใส่ซิตริก</p></article>`}
function preparation(b){const x=RECIPES[b];return `<div class="preparation"><div class="callout warn"><b>สาย ① · แยกชั่งไว้ก่อน</b><br>SER 6 + SUC ${x.suc} + DEX ${x.dex1} g คลุกแห้ง (น้ำตาลรวม ${x.suc+x.dex1} g) → ลงน้ำ ${x.water} g → ต้ม 85 °C คนตลอด → เติมน้ำระเหยคืนให้สาย ① ครบ <b>${x.line1} g</b><br><b>สาย ②</b> INL 20 + MTD 20 + เกลือ 1 + PMP ${x.pmp} + DEX ${x.dex2} g คลุกแห้ง → โรยลงนม 215 g พร้อมคน → อุ่น ~55 °C <b>ห้ามเกิน 55</b> · รวมสาย ② ${x.line2} g<br>รวมสองสาย → <b>blender 30 วิ</b> เพื่อละลายผง ไม่ตีฟอง → ชั่งฐานรวม 500 g → อ่างน้ำแข็งถึง ~20 °C</div>`+
 field('syrup_boil_temp','อุณหภูมิสูงสุดสาย ① (°C)','ตามแผน 85 °C','number',b)+
 field('line1_after_water_back','น้ำหนักสาย ① หลังเติมน้ำระเหยคืน (g)','น้ำหนักสุทธิ ไม่รวมหม้อ · เป้า '+x.line1+' g','number',b,{min:0})+
 field('pmp_g','PMP ที่ใช้ในสาย ② จริง (g)','เป้า '+x.pmp+' g'+(b==='A'?' · ไม่ใส่ ให้กรอก 0':' · โรยช้าๆ คนให้กระจายก่อนอุ่น'),'number',b,{min:0,step:0.01})+
 field('milk_g','นมสดที่ใช้ในสาย ② จริง (g)','เป้า 215 g ทุกถัง','number',b,{min:0})+
 field('line2_total','น้ำหนักสาย ② รวม (g)','น้ำหนักสุทธิ ไม่รวมภาชนะ · เป้า '+x.line2+' g','number',b,{min:0})+
 field('milk_part_temp','อุณหภูมิสาย ② ก่อนรวม (°C)','อุ่น ~55 °C · ห้ามเกิน 55 °C','number',b)+
 field('combine_12_temp','อุณหภูมิหลังรวมสองสาย ก่อน blender (°C)','จดค่าจริง','number',b)+
 field('blender_seconds','เวลาที่ใช้ blender จริง (วินาที)','เป้า 30 วินาที · ละลายผง ไม่ใช่ PBT','number',b,{min:0,step:1})+
 field('pot_total','น้ำหนักฐานรวมหลัง blender (g)','สุทธิ ไม่รวมหม้อ · เป้า 500 g · ชั่งหลังปั่นแล้วก่อนลดถึง ~20 °C','number',b,{min:0})+'</div>'}
function production(b){const x=RECIPES[b];return `<div class="batch-column">
<section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${BATCHES.indexOf(b)+1}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.level} · กรอกจากบนลงล่าง</p></section>
<section class="screen">
${stage('1 · เตรียมฐาน · พักเย็น · รวมทีละถัง',preparation(b)+`<div class="callout"><b>รวมถัง ${b} ก่อนคิวปั่น ~55 นาที</b> · ฐานประมาณ 20 °C → เติมส่วนผลไม้อุณหภูมิห้องทันที · เย็นเลย 20 °C ก็รวมได้ <b>ห้ามอุ่นกลับ</b></div>`+stamp('syrup_cold_time','เวลาที่ฐานถึงประมาณ 20 °C',b)+field('fp_split_g','น้ำหนักส่วนผลไม้ที่ใส่ถังนี้ (g)','เป้า 500 g · คนชุด 1,500 g ให้ทั่วก่อนแบ่ง','number',b,{min:0})+field('fp_temp_split','อุณหภูมิส่วนผลไม้ตอนแบ่ง (°C)','จดตามจริง · รอบนี้ใช้ที่อุณหภูมิห้อง ไม่ต้องแช่เย็น','number',b)+stamp('combine_time','เวลารวมส่วนผลไม้ + ฐาน',b)+calc('syrup_hold_min','เวลาจากฐานถึงประมาณ 20 °C จนรวม (นาที)',b)+field('syrup_temp_combine','อุณหภูมิฐานตอนรวมผลไม้ (°C)','เป้าประมาณ 20 °C · 3 ถังต่างกันไม่เกิน 3 °C · ไม่ต้องอุ่นกลับหากเย็นเลย','number',b)+calc('syrup_temp_spread','ช่วงอุณหภูมิฐานตอนรวมระหว่าง 3 ถัง (°C)',b)+field('fp_temp_combine','อุณหภูมิส่วนผลไม้ตอนรวม (°C)','จดตามจริง · ส่วนผลไม้ไม่ต้องแช่เย็นก่อนรวม','number',b))}

if(typeof window!=="undefined")window.addEventListener("resize",queueLayout);
function save(){D.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(D));document.getElementById('saveState').textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}catch(_){document.getElementById('saveState').textContent='บันทึกในเครื่องไม่ได้ — กรุณาส่งออก JSON'}}
function syncColumnNav(group){const last=Math.max(0,group.children.length-1),maxScroll=group.scrollWidth-group.clientWidth,index=maxScroll>2&&group.scrollLeft>=maxScroll-2?last:Math.max(0,Math.min(last,Math.round(group.scrollLeft/(group.children[0].getBoundingClientRect().width+14))));document.querySelectorAll(`[data-scroll-target="${group.dataset.columnGroup}"]`).forEach((btn,i)=>btn.setAttribute('aria-current',String(i===index)))}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>{const edit=()=>{D.values[key(el.dataset.id,el.dataset.batch)]=el.value;syncAll()};el.addEventListener('change',edit);if(el.type!=='radio'&&el.tagName!=='SELECT')el.addEventListener('input',edit)});document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;if(el.dataset.start&&!D.timers[key(el.dataset.start,b)])return;if(D.timers[key(id,b)])return;D.timers[key(id,b)]=Date.now();beep();render()});document.querySelectorAll('[data-manual]').forEach(el=>{const edit=()=>{const ms=el.value?new Date(el.value).getTime():null;if(ms!==null&&!Number.isFinite(ms))return;D.timers[key(el.dataset.manual,el.dataset.batch)]=ms;syncAll();updateClocks()};el.addEventListener('input',edit);el.addEventListener('change',edit)});document.querySelectorAll('[data-scroll-target]').forEach(btn=>btn.onclick=()=>{const group=document.querySelector(`[data-column-group="${btn.dataset.scrollTarget}"]`),col=group.children[Number(btn.dataset.scrollBatch)];group.scrollTo({left:col.offsetLeft-group.children[0].offsetLeft,behavior:'smooth'})});document.querySelectorAll('[data-column-group]').forEach(group=>group.addEventListener('scroll',()=>syncColumnNav(group)))}
function updateClocks(){document.querySelectorAll('[data-stamp]:not([data-pair]):not([data-start])').forEach(el=>el.disabled=!!D.timers[key(el.dataset.stamp,el.dataset.batch)]);document.querySelectorAll('[data-timer]').forEach(el=>{const start=el.dataset.timer,stop=el.dataset.stop,b=el.dataset.batch,a=D.timers[key(start,b)],z=D.timers[key(stop,b)];el.querySelector('.timer-clock').textContent=clock(start,stop,b);el.querySelector('.help').textContent=`เริ่ม: ${timeText(a)} · หยุด: ${timeText(z)}`;el.querySelector('[data-pair]').disabled=!!a;el.querySelector('[data-start]').disabled=!a||!!z})}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12);o.onended=()=>a.close()}catch(_){}}
function validateImport(x){if(x._form!==FORM||!x.values||Array.isArray(x.values)||typeof x.values!=='object'||!x.timers||Array.isArray(x.timers)||typeof x.timers!=='object')throw Error('invalid');if(Object.entries(x.values).some(([k,v])=>k.length>120||!['string','number','boolean'].includes(typeof v)||typeof v==='number'&&!Number.isFinite(v)))throw Error('invalid values');if(Object.values(x.timers).some(v=>v!==null&&(!Number.isFinite(v)||v<=0||v>8640000000000000)))throw Error('invalid times');return{values:{...empty().values,...x.values,limits:x.values.limits??LIMITS},timers:{...x.timers},updated:x.updated||null}}
const REQUIRED_BLEED=['bleeding','melt_shape','bleeding_photo'];
function missingBleeding(){return BATCHES.flatMap(b=>REQUIRED_BLEED.filter(id=>!String(val(id,b)).trim()).map(id=>({b,id})))}
function updateCompletion(){const missing=missingBleeding(),el=document.getElementById('completionStatus');if(el)el.textContent=missing.length?'ผล Bleeding ยังไม่ครบ '+missing.length+' ช่อง · ต้องมีน้ำเชื่อมแยก รูปทรง และชื่อรูปครบทุกถังก่อนส่งออกฉบับสมบูรณ์ · ระหว่างทำบันทึกฉบับร่างได้':'ผล Bleeding ครบ 3 ถังแล้ว · ส่งออกฉบับสมบูรณ์ได้';document.querySelectorAll('[data-id]').forEach(el=>{if(REQUIRED_BLEED.includes(el.dataset.id)){el.required=true;el.setAttribute('aria-required','true')}})}
function exportJSON(draft=false){syncAll();const missing=missingBleeding();if(!draft&&missing.length){const names={bleeding:'น้ำเชื่อมแยก',melt_shape:'รูปทรง',bleeding_photo:'ชื่อรูป'};alert('กรุณาบันทึก Bleeding ให้ครบก่อนส่งออกฉบับสมบูรณ์:\n'+missing.map(x=>'ถัง '+x.b+' · '+names[x.id]).join('\n')+'\nระหว่างทำใช้ปุ่มบันทึก JSON ฉบับร่างได้');const first=missing[0],el=document.querySelector('[data-id="'+first.id+'"][data-batch="'+first.b+'"]');el?.scrollIntoView({block:'center',inline:'center'});el?.focus();return}const blob=new Blob([JSON.stringify({_form:FORM,_title:TITLE,_schema:1,_status:draft?'draft':'complete',_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=FORM+'-'+(val('date')||'data')+(draft?'-draft':'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('exportBtn').onclick=()=>exportJSON(false);
document.getElementById('draftBtn').onclick=()=>exportJSON(true);
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=validateImport(JSON.parse(reader.result));if(!confirm('นำเข้าไฟล์ SOR7 นี้แทนข้อมูลปัจจุบัน? ส่งออกข้อมูลปัจจุบันก่อนหากต้องการเก็บไว้'))return;D=next;render();alert('นำเข้าข้อมูล SOR7 แล้ว')}catch(_){alert('ไฟล์นี้ใช้กับ SOR7 ไม่ได้ หรือข้อมูลมีรูปแบบไม่ถูกต้อง')}finally{e.target.value=''}};reader.readAsText(file)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูล SOR7 ในเครื่องนี้? ย้อนกลับไม่ได้ กรุณาส่งออก JSON ก่อนหากต้องการเก็บไว้')){D=empty();render()}};
setInterval(updateClocks,1000);render();
})();
</script>
</body>
