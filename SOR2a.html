<script>
(() => {
'use strict';
const FORM='SOR2a',TITLE='SO R2a · C v4 DEX เทียบ v5 SUC และบอดี้ครึ่ง · v8.9.0',KEY='missicecream.SOR2a.v1';
const BATCHES=['A','B','C'];
const RECIPES={
  A:{code:'C v4',level:'DEX 105 · ตัวเทียบความหนืด',inl:30,mtd:20,suc:0,dex:105,water:340,syrup:500,mix:1000,rsw:18.75,ts:'20.8',afpw:37.3,fp:-2.29,ice:63.2,phase:37},
  B:{code:'C v5',level:'SUC 30 + DEX 70',inl:30,mtd:20,suc:30,dex:70,water:345,syrup:500,mix:1000,rsw:19.28,ts:'20.6',afpw:33.4,fp:-2.05,ice:65.0,phase:35},
  C:{code:'C v5',level:'SUC 30 + บอดี้ครึ่ง',inl:15,mtd:10,suc:30,dex:70,water:345,syrup:475,mix:975,rsw:19.28,ts:'≈18.1',afpw:33.4,fp:-2.05,ice:65.0,phase:35}
};
const LIMITS='ผู้ชิม 1 คน (เล็ก) · n=1 ต่อสูตร · คำตัดสินเป็นของผู้เขียน ไม่ใช่สถิติ\nน้ำมะพร้าวระดับ C หวานเกินสำหรับรสนี้โดยตั้งใจ รอบนี้ไม่ใช้ตัดสินความหวาน\nถัง C รวม 975 g ถูกต้อง เพราะลด INL/MTD ครึ่งโดยไม่เติมน้ำชดเชย\nR1-C สตรอว์เบอร์รีผลิตคนละผลไม้และคนละวัน ใช้เทียบหยาบเท่านั้น\n%OR, draw temperature และอุณหภูมิชิมเป็นข้อมูลประกอบ ไม่ใช่เกณฑ์ผ่าน/ตก';
const QUESTIONS=[
  ['Q1','ชนิดน้ำตาล','B (SUC 30 + DEX 70) หนืดน้อยกว่า A (DEX 105) ชัดไหมที่ความหวานใกล้กัน'],
  ['Q2','สารให้บอดี้','C ที่ลด INL/MTD ครึ่ง สะอาดกว่า B หรือบาง เกล็ด หรือเป็นน้ำกว่า'],
  ['Q3','บริกซ์สูตร','ส่วนผลไม้จากน้ำมะพร้าวใสอ่านครั้งแรกได้ 12 ตามสูตรหรือไม่'],
  ['Q4','%OR น้ำมะพร้าว','ผลไม้ไม่มีเนื้อ/เพคตินให้อากาศเท่าใด และ A/B/C ต่างกันหรือไม่']
];
let D=load();
const app=document.getElementById('app');
function empty(){return{values:{date:'',operator1:'',operator2:'',taster:'เล็ก',limits:LIMITS},timers:{},updated:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(_){}return empty()}
function key(id,b){return [id,b].filter(Boolean).join('__')}
function val(id,b){return D.values[key(id,b)]??''}
function n(x){if(x===''||x===null||x===undefined)return null;const z=Number(x);return Number.isFinite(z)?z:null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a){return Object.entries(a).map(([k,v])=>` ${k}="${esc(v)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(type==='number'?{step:'0.1',...a}:a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${key(id,b)}"></div></label>`}
function area(id,label,help='',b=null){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}</label>`}
function select(id,label,opts,help='',b=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}</label>`}
function calc(id,label,b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${key(id,b)}">—</div><div class="warning" data-warn="${key(id,b)}"></div></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function timeText(ms){return ms?new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=x=>String(x).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function seconds(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)];return a&&z&&z>=a?(z-a)/1000:null}
function clock(start,stop,b){const a=D.timers[key(start,b)],z=D.timers[key(stop,b)],s=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0;return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function timer(start,stop,label,b,startText,stopText){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}"${D.timers[key(start,b)]?' disabled':''}>${startText}</button><button class="btn amber" type="button" data-stamp="${stop}" data-start="${start}" data-batch="${b}"${!D.timers[key(start,b)]||D.timers[key(stop,b)]?' disabled':''}>${stopText}</button></div><div class="help">เริ่ม: ${timeText(D.timers[key(start,b)])} · หยุด: ${timeText(D.timers[key(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${[start,stop].map((id,i)=>`<label>${i?'หยุด':'เริ่ม'}<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${toLocal(D.timers[key(id,b)])}"></label>`).join('')}</div></details></div>`}
function recipe(b){const x=RECIPES[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.level}</p><ul><li>ส่วนผลไม้น้ำมะพร้าว 500 g</li><li>SER 3 + XTG 1 + INL ${x.inl} + MTD ${x.mtd} + เกลือ 1 g</li><li>น้ำตาลทราย ${x.suc} + เดกซ์โทรส ${x.dex} + น้ำ ${x.water} g</li><li>ส่วนน้ำเชื่อม ${x.syrup} g · PBT 2 รอบ · บ่มสั้น 30 นาทีที่ 4 °C</li></ul><div class="facts">RSW ${x.rsw} · TS ${x.ts}% · AFPW ${x.afpw} · FP ${x.fp} °C · น้ำแข็ง −14 °C ${x.ice}% · เฟสน้ำเชื่อม ${x.phase}%</div><div class="total">รวมมิกซ์ตามสูตร ${x.mix.toLocaleString()} g${b==='C'?' · 975 g ถูกต้อง ไม่เติมน้ำชดเชย':''}</div></article>`}
function production(b){const x=RECIPES[b];return `<div class="batch-column">
<section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${BATCHES.indexOf(b)+1}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.level} · กรอกจากบนลงล่าง</p></section>
<section class="screen">
${stage('1 · ทำส่วนน้ำเชื่อม · เย็น · รวมส่วนผลไม้',`<div class="callout">ชั่งผงแห้งของถัง ${b} แยกทุกตัว → คลุกให้กระจาย → โรยลงน้ำ ${x.water} g → ต้ม <b>85 °C</b> → เติมน้ำระเหยคืนให้ส่วนน้ำเชื่อมครบ <b>${x.syrup} g</b> → เย็น ≤10 °C → รวมส่วนผลไม้ 500 g</div>`+field('syrup_boil_temp','อุณหภูมิสูงสุดของส่วนน้ำเชื่อม (°C)','ตามแผน 85 °C','number',b)+field('syrup_water_back','น้ำที่เติมคืนหลังต้ม (g)',`เติมคืนให้ส่วนน้ำเชื่อมครบ ${x.syrup} g`,'number',b,{min:0})+field('fp_split_g','น้ำหนักส่วนผลไม้ที่ใส่ถังนี้ (g)','เป้า 500.0 g · คนชุด 1,500 g ให้ทั่วก่อนแบ่ง','number',b,{min:0})+field('syrup_temp_combine','อุณหภูมิส่วนน้ำเชื่อมตอนรวม (°C)','ต้อง ≤10 °C','number',b)+field('fp_temp_combine','อุณหภูมิส่วนผลไม้ตอนรวม (°C)','ต้อง ≤10 °C','number',b))}
${stage('2 · PBT · Cooling ถึง 4 °C',`<div class="callout">PBT <b>2 รอบ × 30 วินาที พัก 10 วินาที</b> · จบรอบ 2 → เติมกลิ่นมะพร้าวน้ำหอม <b>1 g ทุกถัง รวมถัง C</b> คนให้เข้ากัน → ลดอุณหภูมิถึง 4 °C → <b>บ่มสั้น 30 นาที</b></div>`+timer('pbt_start','pbt_stop','จับเวลาตั้งแต่เริ่ม PBT รอบ 1 ถึงจบรอบ 2',b,'เริ่ม PBT รอบ 1','จบ PBT รอบ 2')+calc('pbt_seconds','เวลา PBT จริง (วินาที)',b)+select('foam_after_pbt','ฟองหลัง PBT',['ไม่มี','บาง','หนา'],'',b)+select('mix_look','ลักษณะมิกซ์หลัง PBT',['เนียน','ข้นแต่ยังไหล','แยกชั้น / ตกตะกอน','อื่นๆ'],'',b)+area('mix_look_note','รายละเอียดมิกซ์หลัง PBT (ถ้ามี)','',b)+field('aroma_g','กลิ่นมะพร้าวน้ำหอมที่เติมจริง (g)','หลัง PBT รอบ 2 ก่อนบ่ม · เป้า 1 g ทุกถัง รวม C · ไม่นับในองค์ประกอบสูตร','number',b,{min:0,step:'0.01'})+timer('cool_start_time','time_at_4c','Cooling หลัง PBT ถึง 4 °C',b,'เริ่ม Cooling','ถึง 4 °C / พร้อมบ่ม')+calc('cool_total','เวลา Cooling หลัง PBT (นาที)',b))}
${stage('3 · บ่มสั้น 30 นาที ที่ 4 °C',`<div class="callout">เริ่มเมื่อมิกซ์ถึง <b>4 °C</b> · บ่ม <b>30 นาที</b> เท่ากันทุกถัง · ถ้าต่างจาก 30 ±5 นาที ให้จดในสิ่งที่ต่างจากแผน</div>`+timer('age_start','age_end','นาฬิกาจับเวลาบ่ม',b,'เริ่มบ่ม','จบบ่ม')+calc('age_minutes','เวลาบ่มจริง (นาที)',b))}
${stage('4 · ชั่งมิกซ์ 2 ครั้ง · เทเข้าโถ',`<div class="callout"><b>①</b> ถ้ามีฟองหนา ให้รอฟองยุบหรือตักจากก้น <b>②</b> ชั่งถ้วยเปล่า <b>③</b> เทมิกซ์ใส่ถ้วย เคาะไล่ฟอง ปาดเรียบ ชั่ง 2 ครั้ง <b>④</b> เทคืนลงโถทั้งหมด <b>⑤</b> วัดอุณหภูมิในโถก่อนกดปั่น</div>`+field('cup_empty','น้ำหนักถ้วยเปล่า — สำหรับวัด %OR (g)','ถ้วยแห้งสนิท · กรอกแยกถัง เผื่อใช้คนละถ้วย','number',b,{min:0})+field('cup_mix_1','น้ำหนักถ้วย + มิกซ์ ปาดเรียบ — ครั้งที่ 1 (g)','น้ำหนักรวมถ้วย · เคาะไล่ฟองก่อนปาด','number',b,{min:0})+field('cup_mix_2','น้ำหนักถ้วย + มิกซ์ ปาดเรียบ — ครั้งที่ 2 (g)','เทออกแล้วเทใหม่ เคาะไล่ฟอง และปาดใหม่','number',b,{min:0})+select('mix_foam_note','มิกซ์ที่ใช้ชั่งมีฟองหรือไม่',['ไม่มีฟอง','มีฟองบาง','มีฟองหนา — รอหรือตักจากก้น'],'จดเพื่อใช้ตีความ %OR',b)+calc('mix_net','น้ำหนักมิกซ์สุทธิเฉลี่ย 2 ครั้ง (g)',b)+field('entry_temp','อุณหภูมิมิกซ์ในโถก่อนกดปั่น (°C)','เป้า ≤4 °C · 3 ถังต่างกันไม่เกิน 1 °C','number',b)+calc('entry_spread','ช่วงอุณหภูมิเข้าโถระหว่าง 3 ถัง (°C)',b))}

function score(id,label,min,max,help,b){const values=Array.from({length:max-min+1},(_,i)=>min+i);return `<div class="field score-field" data-score-batch="${b}"><span>${label}</span><div class="scale${max===3&&min===0?' scale4':max===10?' scale11':''}">${values.map(v=>`<label><input type="radio" name="${key(id,b)}" data-id="${id}" data-batch="${b}" data-taste="14" value="${v}"${String(val(id,b))===String(v)?' checked':''}><span>${v>0&&min<0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small></div>`}
function tastingColumn(b){const x=RECIPES[b];return `<div class="taste-column"><div class="tasting-head"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.level} · RSW ${x.rsw}</p></div><article class="taste-card">${field('temp_taste','อุณหภูมิกลางถังตอนชิม (°C)','เป้า −14 °C · ช่วงเปรียบเทียบ −14.5 ถึง −13.5','number',b)}<div class="callout warn" data-lock="${b}">กรอกอุณหภูมิตัวอย่างนี้ก่อน จึงจะเปิดคะแนน</div>${SCORES.map(s=>score(...s,b)).join('')}${select('s_melt','ละลายในปาก',['เร็ว','ปกติ','ช้า'],'',b)}${area('s_note','บันทึกเพิ่มของตัวอย่างนี้','',b)}</article></div>`}

<section class="screen"><h2>คำตอบหลังชิม · เล็กคนเดียว</h2><div class="single-fields">${select('s_rank','ถังที่เนื้อดีที่สุด',['A · C v4 DEX 105','B · C v5 SUC 30 + DEX 70','C · C v5 + บอดี้ครึ่ง'],'เลือกหลังชิมครบ 3 ถัง')}${select('q1_choice','Q1 · B หนืดน้อยกว่า A หรือไม่',['ใช่ ชัดเจน','ต่างเล็กน้อย','ไม่ต่าง','B หนืดกว่า A','ตัดสินไม่ได้'])}${select('q2_choice','Q2 · C เทียบ B',['C สะอาดกว่าและไม่บาง','C สะอาดกว่าแต่บาง/เกล็ด','ไม่ต่าง','C แย่กว่า B','ตัดสินไม่ได้'])}${area('r1c_note','เทียบ R1-C สตรอว์เบอร์รี (ถ้ายังเหลือ)','เป็นคนละผลไม้และคนละวัน ใช้เทียบหยาบเท่านั้น')}</div></section>
<section class="screen"><h2>สรุปค่าที่บันทึก · ไม่ใช่ Verdict อัตโนมัติ</h2><div class="summary-grid">${BATCHES.map(b=>`<article><h3>ถัง ${b} · ${RECIPES[b].level}</h3>${calc('summary_sticky','หนืด / เหนียว 0–3',b)}${calc('summary_body','บอดี้ −3…+3',b)}${calc('summary_icy','เกล็ด / สาก 0–3',b)}${calc('summary_like','ชอบด้านเนื้อ 0–10',b)}</article>`).join('')}</div>${calc('or_spread','%OR สูงสุด − ต่ำสุดของ A/B/C (จุดเปอร์เซ็นต์)')}</section>
<section class="screen"><h2>Verdict · ผล → ตีความ → ทำอะไรต่อ</h2>${QUESTIONS.map(q=>`<div class="verdict"><h3>${q[0]} · ${q[1]}</h3><p class="sub">${q[2]}</p><div class="single-fields">${area(q[0].toLowerCase()+'_result','ผลที่พบ')}${area(q[0].toLowerCase()+'_interpretation','ตีความ / หลักฐาน / ข้อจำกัด')}${area(q[0].toLowerCase()+'_next','ทำอะไรต่อ')}</div></div>`).join('')}<div class="single-fields">${select('verdict','Verdict รวม',['v5 ยืนยัน — B ไม่หนืด → R3 ผลไม้อื่น','v5 ยืนยัน + ลด INL/MTD ครึ่ง','ยังหนืด → R2b ทดสอบ S/E','ตัดสินไม่ได้'])}${area('conclusion','สรุป / สูตรที่เลือก')}${field('action1','Action ถัดไป 1','','text')}${field('action2','Action ถัดไป 2','','text')}${field('action3','Action ถัดไป 3','','text')}${area('limits','ข้อจำกัดการตีความ','แก้ไข / เพิ่มเติมได้')}</div></section>`;
bind();syncAll();updateClocks();document.querySelectorAll('[data-column-group]').forEach(el=>{el.scrollLeft=scrolls[el.dataset.columnGroup]||0;syncColumnNav(el)});save()}
function setCalc(id,b,x,unit=''){const el=document.getElementById('calc_'+key(id,b));if(x===null||x===''){delete D.values[key(id,b)];if(el)el.textContent='—';return}D.values[key(id,b)]=typeof x==='number'?x.toFixed(1):x;if(el)el.textContent=D.values[key(id,b)]+(unit?' '+unit:'')}
function warn(id,b,msg){const el=document.querySelector(`[data-warn="${key(id,b)}"]`);if(el){el.textContent=msg;el.classList.toggle('show',!!msg)}}
function iceSelection(b,cup){const weights=[1,2,3].map(i=>n(val('cup_ic_'+i,b)));if(!(cup>0&&weights[0]>cup&&weights[1]>cup))return{needThird:false,selected:null,note:null};const diff=Math.abs(weights[0]-weights[1]);if(diff<=3)return{needThird:false,selected:(weights[0]+weights[1])/2-cup,note:`ครั้งที่ 1↔2 ต่าง ${diff.toFixed(1)} g → ใช้ค่าเฉลี่ย`};if(!(weights[2]>cup))return{needThird:true,selected:null,note:`ครั้งที่ 1↔2 ต่าง ${diff.toFixed(1)} g → ต้องชั่งครั้งที่ 3`};const pairs=[[0,1],[0,2],[1,2]].map(([a,z])=>({a,z,d:Math.abs(weights[a]-weights[z])})).sort((a,z)=>a.d-z.d),best=pairs[0];return best.d<=3?{needThird:true,selected:(weights[best.a]+weights[best.z])/2-cup,note:`ใช้ครั้งที่ ${best.a+1} และ ${best.z+1} · คู่ใกล้ที่สุดต่าง ${best.d.toFixed(1)} g`}:{needThird:true,selected:null,note:`คู่ใกล้ที่สุดยังต่าง ${best.d.toFixed(1)} g (>3 g) → ชั่งใหม่ ยังไม่คำนวณ %OR`}}
function syncBatch(b){const cup=n(val('cup_empty',b)),gross1=n(val('cup_mix_1',b)),gross2=n(val('cup_mix_2',b)),mix=cup>0&&gross1>cup&&gross2>cup?(gross1+gross2)/2-cup:null,ice=iceSelection(b,cup);setCalc('pbt_seconds',b,seconds('pbt_start','pbt_stop',b),'วินาที');const age=seconds('age_start','age_end',b);setCalc('age_minutes',b,age===null?null:age/60,'นาที');warn('age_minutes',b,age!==null&&(age<25*60||age>35*60)?'เวลาบ่มต่างจาก 30 ±5 นาที · จดในสิ่งที่ต่างจากแผน':'');const ageA=D.timers[key('age_start',b)],ageZ=D.timers[key('age_end',b)];if(ageZ&&(!ageA||ageZ<ageA))warn('age_minutes',b,'เวลาจบบ่มต้องไม่ก่อนเวลาเริ่ม · แก้เวลาด้วยมือ');const cool=seconds('cool_start_time','time_at_4c',b),churn=seconds('churn_start','churn_stop',b);setCalc('cool_total',b,cool===null?null:cool/60,'นาที');setCalc('churn_minutes',b,churn===null?null:churn/60,'นาที');setCalc('mix_net',b,mix,'g');setCalc('ic_check',b,ice.note);setCalc('ic_net',b,ice.selected,'g');setCalc('overrun',b,mix>0&&ice.selected>0?(mix-ice.selected)/ice.selected*100:null,'%');const third=document.querySelector(`[data-third="${b}"]`);if(third)third.classList.toggle('hidden',!ice.needThird);warn('cup_empty',b,cup!==null&&cup<=0?'น้ำหนักถ้วยเปล่าต้องมากกว่า 0':'');['cup_mix_1','cup_mix_2','cup_ic_1','cup_ic_2','cup_ic_3'].forEach(id=>{const g=n(val(id,b));warn(id,b,g!==null&&!(cup>0)?'กรอกน้ำหนักถ้วยเปล่าก่อน':g!==null&&g<=cup?'น้ำหนักรวมถ้วยต้องมากกว่าถ้วยเปล่า':'')});['syrup_temp_combine','fp_temp_combine'].forEach(id=>{const t=n(val(id,b));warn(id,b,t!==null&&t>10?'ยังสูงกว่า 10 °C · ระบุในสิ่งที่ต่างจากแผน':'')});const entry=n(val('entry_temp',b));warn('entry_temp',b,entry!==null&&entry>4?'สูงกว่าเป้า 4 °C · จดตามจริงและระบุในสิ่งที่ต่างจากแผน':'');['pbt_start','cool_start_time','churn_start'].forEach(start=>{const stop={pbt_start:'pbt_stop',cool_start_time:'time_at_4c',churn_start:'churn_stop'}[start],a=D.timers[key(start,b)],z=D.timers[key(stop,b)],out=start==='pbt_start'?'pbt_seconds':start==='cool_start_time'?'cool_total':'churn_minutes';warn(out,b,z&&(!a||z<a)?'เวลาหยุดต้องไม่ก่อนเวลาเริ่ม · แก้เวลาในช่องแก้เวลาด้วยมือ':'')})}
function syncTaste(b){const t=n(val('temp_taste',b)),ready=t!==null;warn('temp_taste',b,ready&&(t<-14.5||t>-13.5)?'อุณหภูมิอยู่นอก −14.5 ถึง −13.5 °C · เก็บคะแนนได้ แต่ต้องระบุข้อจำกัด':'');const lock=document.querySelector(`[data-lock="${b}"]`);if(lock)lock.classList.toggle('hidden',ready);document.querySelectorAll(`[data-taste][data-batch="${b}"]`).forEach(el=>el.disabled=!ready);document.querySelectorAll(`[data-score-batch="${b}"]`).forEach(el=>el.classList.toggle('locked',!ready));[['s_sticky','summary_sticky'],['s_body','summary_body'],['s_icy','summary_icy'],['s_like','summary_like']].forEach(([id,out])=>setCalc(out,b,val(id,b)))}
function syncAll(){D.values.tool_mode='ใช้ผลไม้มากที่สุด';const diluted=n(val('syr_brix_diluted'));setCalc('syr_brix',null,diluted===null?null:diluted*2,'°Bx');const fruit=n(val('actual_fruit')),helper=n(val('actual_helper')),extra=n(val('extra_helper')),initial=[fruit,helper].every(x=>x!==null)?fruit+helper:null;setCalc('initial_total',null,initial,'g');setCalc('final_total',null,initial!==null&&extra!==null?initial+extra:null,'g');const step=n(val('tool_step')),first=n(val('fp_brix_first')),final=n(val('fp_brix_final'));warn('tool_step',null,step!==null&&step!==12?'ขั้นต้องเป็น 12 · ตรวจค่าที่ป้อนเว็บก่อนชั่ง':'');warn('fp_brix_first',null,first!==null&&(first<11.5||first>12.5)?'นอก 11.5–12.5 °Bx · จดค่าครั้งแรกนี้ก่อนปรับ':'');warn('fp_brix_final',null,final!==null&&(final<11.5||final>12.5)?'บริกซ์สุดท้ายยังนอก 11.5–12.5 °Bx · จดค่าจริงและระบุในหมายเหตุ':'');warn('syr_brix_diluted',null,diluted!==null&&(diluted<0||diluted>50)?'ค่าเจือ 1:1 ต้องอยู่ระหว่าง 0–50 °Bx':'');BATCHES.forEach(syncBatch);BATCHES.forEach(syncTaste);const entry=BATCHES.map(b=>n(val('entry_temp',b))),range=entry.every(x=>x!==null)?Math.max(...entry)-Math.min(...entry):null;BATCHES.forEach(b=>{setCalc('entry_spread',b,range,'°C');warn('entry_spread',b,range!==null&&range>1?'3 ถังต่างกันเกิน 1 °C · จดเพื่อใช้ตีความ':'')});const ors=BATCHES.map(b=>n(val('overrun',b))),orRange=ors.every(x=>x!==null)?Math.max(...ors)-Math.min(...ors):null;setCalc('or_spread',null,orRange,'จุดเปอร์เซ็นต์');save()}
function save(){D.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(D));document.getElementById('saveState').textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}catch(_){document.getElementById('saveState').textContent='บันทึกในเครื่องไม่ได้ — กรุณาส่งออก JSON'}}
function syncColumnNav(group){const last=Math.max(0,group.children.length-1),maxScroll=group.scrollWidth-group.clientWidth,index=maxScroll>2&&group.scrollLeft>=maxScroll-2?last:Math.max(0,Math.min(last,Math.round(group.scrollLeft/(group.children[0].getBoundingClientRect().width+14))));document.querySelectorAll(`[data-scroll-target="${group.dataset.columnGroup}"]`).forEach((btn,i)=>btn.setAttribute('aria-current',String(i===index)))}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener(el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{D.values[key(el.dataset.id,el.dataset.batch)]=el.value;syncAll()}));document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;if(el.dataset.start&&!D.timers[key(el.dataset.start,b)])return;if(D.timers[key(id,b)])return;D.timers[key(id,b)]=Date.now();beep();render()});document.querySelectorAll('[data-manual]').forEach(el=>{const edit=()=>{const ms=el.value?new Date(el.value).getTime():null;if(ms!==null&&!Number.isFinite(ms))return;D.timers[key(el.dataset.manual,el.dataset.batch)]=ms;syncAll();updateClocks()};el.addEventListener('input',edit);el.addEventListener('change',edit)});document.querySelectorAll('[data-scroll-target]').forEach(btn=>btn.onclick=()=>{const group=document.querySelector(`[data-column-group="${btn.dataset.scrollTarget}"]`),col=group.children[Number(btn.dataset.scrollBatch)];group.scrollTo({left:col.offsetLeft-group.children[0].offsetLeft,behavior:'smooth'})});document.querySelectorAll('[data-column-group]').forEach(group=>group.addEventListener('scroll',()=>syncColumnNav(group)))}
function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>{const start=el.dataset.timer,stop=el.dataset.stop,b=el.dataset.batch,a=D.timers[key(start,b)],z=D.timers[key(stop,b)];el.querySelector('.timer-clock').textContent=clock(start,stop,b);el.querySelector('.help').textContent=`เริ่ม: ${timeText(a)} · หยุด: ${timeText(z)}`;el.querySelector('[data-pair]').disabled=!!a;el.querySelector('[data-start]').disabled=!a||!!z})}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12);o.onended=()=>a.close()}catch(_){}}
function validateImport(x){if(x._form!==FORM||!x.values||Array.isArray(x.values)||typeof x.values!=='object'||!x.timers||Array.isArray(x.timers)||typeof x.timers!=='object')throw Error('invalid');if(Object.entries(x.values).some(([k,v])=>k.length>120||!['string','number','boolean'].includes(typeof v)||typeof v==='number'&&!Number.isFinite(v)))throw Error('invalid values');if(Object.values(x.timers).some(v=>v!==null&&(!Number.isFinite(v)||v<=0||v>8640000000000000)))throw Error('invalid times');return{values:{...empty().values,...x.values},timers:{...x.timers},updated:x.updated||null}}
document.getElementById('exportBtn').onclick=()=>{syncAll();const blob=new Blob([JSON.stringify({_form:FORM,_title:TITLE,_schema:2,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=FORM+'-'+(val('date')||'data')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=validateImport(JSON.parse(reader.result));if(!confirm('นำเข้าไฟล์ SOR2a นี้แทนข้อมูลปัจจุบัน? ส่งออกข้อมูลปัจจุบันก่อนหากต้องการเก็บไว้'))return;D=next;render();alert('นำเข้าข้อมูล SOR2a แล้ว')}catch(_){alert('ไฟล์นี้ใช้กับ SOR2a ไม่ได้ หรือข้อมูลมีรูปแบบไม่ถูกต้อง')}finally{e.target.value=''}};reader.readAsText(file)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูล SOR2a ในเครื่องนี้? ย้อนกลับไม่ได้ กรุณาส่งออก JSON ก่อนหากต้องการเก็บไว้')){D=empty();render()}};
setInterval(updateClocks,1000);render();
})();
</script>
</body>
