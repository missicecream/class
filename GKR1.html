  <link rel="stylesheet" href="yd-lab.css">
  <style>
    .wrap{width:min(1320px,100%)}

<footer>GK R1 · MR v8.7.1 · ทดลอง 10 สิงหาคม 2026 · ข้อมูลเก็บในเครื่องนี้</footer>
<script>
(() => {
'use strict';
const C={
 file:'GKR1',title:'GK R1 · เบสกรีกโยเกิร์ตปั่นครั้งแรก',subtitle:'Cooling ด้วย overhead stirrer · 3 ถัง · G10 · PBT ×2 · บ่มสั้น 30 นาที',
 purpose:'ดูว่า cooling ด้วย overhead stirrer รับมิกซ์กรีกที่ข้นและอินูลินสูงได้ไหม พร้อมตั้ง baseline ของ Meiji และ Dutchie Greek yogurt',
 critical:'รอบ feasibility ไม่มีถัง control · ทำทีละถังตามลำดับ A → B → C ห้ามสลับ · สาย S/E ใช้น้ำตาลทรายทั้งหมดของถัง · โยเกิร์ตเติมที่ <20 °C และครีมที่ ≤10 °C',
 batches:{
  A:{code:'GMDL05',summary:'Meiji Greek · Fat 5.01% · TS 27.48%',hot:'เบสร้อนเข้า PBT ประมาณ 1,068 g',yogurt:'โยเกิร์ตกรีกเมจิ (YGM)',formula:['① SER 12 + SUC 64 + WTR 202','② PMP 46 + DEX 144 + INL 60 + MLK 540','③ YGM 900 ที่ <20 °C','④ CRM 32 ที่ ≤10 °C']},
  B:{code:'GDDL07',summary:'Dutchie Greek · Fat 6.99% · เบสห้องเรียน',hot:'เบสร้อนเข้า PBT ประมาณ 806 g',yogurt:'โยเกิร์ตกรีกดัชชี่ (YGD)',formula:['① SER 12 + SUC 58 + WTR 204','② PMP 40 + DEX 140 + INL 60 + MLK 292','③ YGD 900 ที่ <20 °C','④ CRM 294 ที่ ≤10 °C']},
  C:{code:'GDDL09',summary:'Dutchie Greek · Fat 8.99% · มิกซ์ข้นสุด',hot:'เบสร้อนเข้า PBT ประมาณ 684 g',yogurt:'โยเกิร์ตกรีกดัชชี่ (YGD)',formula:['① SER 12 + SUC 58 + WTR 208','② PMP 44 + DEX 136 + INL 54 + MLK 172','③ YGD 900 ที่ <20 °C','④ CRM 416 ที่ ≤10 °C']}
 },
 weeks:[{id:'wk0',label:'ครั้งที่ 1 · wk0',date:'2026-08-11'},{id:'wk4',label:'ครั้งที่ 2 · wk4',date:'2026-09-07'},{id:'wk12',label:'ครั้งที่ 3 · wk12',date:'2026-11-02'}],
 limits:['n = 1 ต่อสูตร · ไม่มีถัง control','3 สูตรต่างกันหลายตัวแปรพร้อมกัน: ยี่ห้อโยเกิร์ต · ไขมัน · TS · ปริมาณเบสร้อน','สรุปสาเหตุเป็นตัวๆ ไม่ได้ · คู่ B–C เท่านั้นที่ต่างกันหลักๆ ที่ไขมัน แต่ปริมาตรเบสร้อนยังต่างกัน','ผู้ชิมคนเดียว (เล็ก) · ไม่ blind']
};
const BATCHES=['A','B','C'],KEY='missicecream.'+C.file+'.v1';
let D=load();
const app=document.getElementById('app'),saveState=document.getElementById('saveState'),progress=document.getElementById('progress');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(e){}return{values:{},timers:{},updated:null}}
function save(){D.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(D));saveState.textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});progress.style.width=Math.min(100,Object.values(D.values).filter(v=>v!==''&&v!==false).length/1.2)+'%'}
function k(id,b){return b?id+'__'+b:id}
function val(id,b){return D.values[k(id,b)]??''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a={}){return Object.entries(a).map(([x,y])=>y===null||y===undefined?'':` ${x}="${esc(y)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={},cls=''){return `<label class="field ${cls}"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function area(id,label,help='',b=null,cls=''){return `<label class="field ${cls}"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function select(id,label,opts,help='',b=null){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function check(id,label){return `<label class="check"><input type="checkbox" data-id="${id}"${val(id)?' checked':''}><span>${label}</span></label>`}
function calc(id,label,unit='',b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${k(id,b)}">${val(id,b)!==''?esc(val(id,b))+(unit?' '+unit:''):'—'}</div><div class="warning" data-warn="${id}" data-batch="${b||''}"></div></div>`}
function timeText(ms){return ms?new Date(ms).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'medium'}):'—'}
function timer(start,stop,label,b,mode='up'){const s=D.timers[k(start,b)],e=D.timers[k(stop,b)];return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}" data-mode="${mode}"><div class="timer-label">${label}</div><div class="timer-clock">${durationClock(start,stop,b,mode)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}">เริ่ม</button><button class="btn amber" type="button" data-stamp="${stop}" data-batch="${b}">หยุด</button></div><div class="help">เริ่ม: ${timeText(s)} · หยุด: ${timeText(e)}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid"><label>เริ่ม<input type="datetime-local" data-manual="${start}" data-batch="${b}" value="${esc(toLocalInput(s))}"></label><label>หยุด<input type="datetime-local" data-manual="${stop}" data-batch="${b}" value="${esc(toLocalInput(e))}"></label></div></details></div>`}
function toLocalInput(ms){if(!ms)return'';const d=new Date(ms),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function duration(start,stop,b){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)];return a&&z&&z>=a?(z-a)/60000:null}
function durationClock(start,stop,b,mode){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)],sec=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0,t=mode==='down'?Math.max(0,1800-sec):sec;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function formulaCard(b){const x=C.batches[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.summary}</p><ul>${x.formula.map(y=>`<li>${y}</li>`).join('')}</ul><div class="hot-weight">${x.hot}</div><div class="total">รวม 2,000 g</div></article>`}
function batchColumn(b){const x=C.batches[b];return `<div class="batch-column"><section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${b==='A'?'1':b==='B'?'2':'3'} · คอลัมน์ ${b}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.summary} · กรอกจากบนลงล่าง</p></section><section class="screen">
${stage('1 · สาย S/E · อุ่นมิกซ์ · PBT',select('se_smooth','สาย S/E เนียนไหม',['เนียนดี','มีเม็ดเล็กน้อย','เป็นเม็ดสาคู'],'ต้องถึง 85 °C และไม่มีเม็ดสาคู',b)+field('mix_temp_max','อุณหภูมิสูงสุดของมิกซ์รวม (°C)','เป้า 68–70 °C','number',b,{step:'0.1'})+field('pbt_in_temp','อุณหภูมิในโถก่อนเริ่ม PBT (°C)','เป้า ≥58 °C','number',b,{step:'0.1'})+`<div class="callout"><b>PBT 2 รอบ</b> · รอบละ 30 วินาที · พัก 10 วินาที · ไม่ต้องจับเวลาแยก</div>`+field('pbt_end_temp','อุณหภูมิในโถตอนจบ PBT (°C)','เป้า ≥55 °C','number',b,{step:'0.1'})+select('pbt_foam','ฟองอากาศหลัง PBT',['ไม่มี','นิดหน่อย','ชัดเจน','ล้นโถ'],'สำคัญต่อการตีความ %OR',b)+field('pbt_weight','น้ำหนักมิกซ์หลัง PBT (g)','ชั่งหลังประเมินฟองอากาศ','number',b,{step:'0.1'})+field('pbt_note','สังเกตเพิ่ม','','text',b))}
${stage('2 · Cooling ⭐',timer('cool_start','cool_end','เวลาลดความร้อนถึง 4 °C',b)+field('yog_temp',`อุณหภูมิตอนเติม${x.yogurt} (°C)`,'ต้องต่ำกว่า 20 °C · ค่อยๆ เติมพร้อมคน ห้ามเทกระจุก','number',b,{step:'0.1'})+field('cream_temp','อุณหภูมิตอนเติมครีม (°C)','ต้อง ≤10 °C','number',b,{step:'0.1'})+calc('cool_total','เวลาลดความร้อนรวม','นาที',b)+area('cool_problem','ปัญหาที่พบตอนลดความร้อน','ถ้าไม่มีให้เขียนว่า “ไม่มี” · ถ้ามีให้ระบุว่าเกิดตอนไหน',b,'main-observation'),'อ่างน้ำแข็ง + overhead stirrer · เป้า 4 °C ภายใน 45–60 นาที')}
${stage('3 · บ่มสั้น',field('mix_weight_before_age','น้ำหนักมิกซ์ทั้งหมดก่อนเริ่มบ่ม (g)','ชั่งก่อนเริ่มนาฬิกาบ่ม','number',b,{step:'0.1'})+timer('age_start','age_stop','นับถอยหลังบ่ม 30 นาที',b,'down')+calc('age_minutes','เวลาบ่มจริง','นาที',b)+select('mix_settle','ฟองยุบหมดก่อนชั่งไหม',['ยุบหมด','ยังมีฟอง','ไม่ได้ดู'],'เชื่อมกับ H2 เรื่องมิกซ์อมอากาศ',b),'เริ่มเมื่อมิกซ์ถึง 4 °C · บ่ม 30 นาทีเป๊ะ')}
${stage('4 · ชั่ง · เทเข้าเครื่อง · จับเวลาปั่น',field('cup_empty','น้ำหนักถ้วยเปล่า (g)','ชั่งก่อนใส่มิกซ์ของถังนี้','number',b,{step:'0.1'})+field('cup_mix','น้ำหนักถ้วย + มิกซ์ (g)','','number',b,{step:'0.1'})+field('entry_temp','อุณหภูมิมิกซ์ตอนเทเข้าเครื่อง (°C)','บันทึกค่าจริง','number',b,{step:'0.1'})+select('pour_note','เทเข้าโถลื่นไหม',['ไหลดี','ข้นแต่เทได้','ต้องปาด'],'',b)+timer('churn_start','churn_stop','นาฬิกาจับเวลาระหว่างปั่น',b),'กดเริ่มพร้อมเครื่องและกดหยุดเมื่อปั่นเสร็จ · ไม่วัดอุณหภูมิระหว่างปั่น')}
${stage('5 · ปั่นเสร็จ · %OR',calc('stop_minute','เวลาปั่นรวม','นาที',b)+select('machine_stop_type','เครื่องหยุดแบบไหน',['หยุดปกติ (ครบรอบ)','overload เครื่องตัด','กดหยุดเอง'],'',b)+field('draw_temp','อุณหภูมิตอนปั่นเสร็จ (°C)','วัดเมื่อเครื่องหยุด','number',b,{step:'0.1'})+field('cup_ic_1','น้ำหนักถ้วย + ไอศกรีม ปาดเรียบ ครั้งที่ 1 (g)','เติมเต็ม ปาดเรียบ แล้วชั่ง','number',b,{step:'0.1'})+field('cup_ic_2','น้ำหนักถ้วย + ไอศกรีม ปาดเรียบ ครั้งที่ 2 (g)','เติมใหม่ ปาดเรียบ แล้วชั่งซ้ำ','number',b,{step:'0.1'})+calc('ic_repeat','ตรวจการชั่ง 2 ครั้ง','',b)+calc('ic_net','น้ำหนักไอศกรีมสุทธิที่ใช้','g',b)+calc('or_pct','%OR','%',b)+select('texture_after','เนื้อตอนปั่นเสร็จ',['แห้งปกติ','แห้งและเนียนเงาสวย','มีน้ำซึมผิว แห้งเกือบปกติ','เหลว ไม่ปกติ'],'ดูทันทีหลังดึงออก',b)+field('texture_note','สังเกตเนื้อเพิ่ม','','text',b)+area('deviation','ทำไม่ตรงแผนตรงไหนบ้าง','ถ้าไม่มีให้เขียนว่า “ไม่มี”',b),'ชั่ง 2 ครั้ง: ต่างกัน ≤5% ใช้ค่าเฉลี่ย · ต่างกัน >5% ใช้น้ำหนักที่มากกว่า')}
</section></div>`}
function score(id,label,min,max,help,b,w){const full=id+'_'+w;if(max===10)return field(full,label,'กรอกคะแนน 0–10','number',b,{min,max,step:'1'});const values=Array.from({length:max-min+1},(_,i)=>min+i),cls=values.length===4?'scale scale4':'scale';return `<div class="field"><span>${label}</span><div class="${cls}">${values.map(v=>`<label><input type="radio" name="${k(full,b)}" data-id="${full}" data-batch="${b}" value="${v}"${String(val(full,b))===String(v)?' checked':''}><span>${v>0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small></div>`}
function tasteCard(b,w){return `<article class="taste-card"><h3>ถัง ${b} · ${C.batches[b].code}</h3>${score('s_scoop','ตักง่าย–ยาก',-3,3,'−3…+3',b,w)}${score('s_sweet','ความหวานโดยรวม',-3,3,'−3…+3',b,w)}${score('s_body','เนื้อแน่น (body)',-3,3,'−3…+3',b,w)}${score('s_creamy','ครีมมี่',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_gummy','เหนียวเป็นยาง',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_chalky','ฝืด/เป็นชอล์ก',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_icy','ความสาก',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_cold','อุ่น–เย็นลิ้น',-3,3,'−3…+3',b,w)}${score('s_melt','อัตราการละลาย',-3,3,'−3…+3',b,w)}${score('s_aftertaste','หวานค้างลิ้น/คอ',-3,3,'−3…+3',b,w)}${score('s_offflavor','รสกลิ่นแปลก (เดกซ์โทรส)',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_tart','เปรี้ยวโยเกิร์ต',0,3,'0 ไม่มี · 3 ชัดมาก',b,w)}${score('s_like','ชอบโดยรวม',0,10,'0–10',b,w)}${area('s_note_'+w,'บันทึกเพิ่ม','',b)}</article>`}
function hSelect(id,label,opts){return `<div>${select(id,label,opts)}${area(id.replace('_verdict','_note'),'เหตุผล / หลักฐานที่ใช้ตัดสิน')}</div>`}
function render(){let html=`<section class="screen"><div class="eyebrow">แผนการทดลอง · อ่านก่อนเริ่ม</div><h2>${C.title}</h2><p class="lead">${C.purpose}</p><div class="callout danger">${C.critical}</div><div class="formula-grid">${BATCHES.map(formulaCard).join('')}</div><details><summary>หัวข้อที่ต้องตอบและข้อจำกัดการตีความ</summary><div class="research-grid"><article><h3>H1 · Cooling</h3><p>ทั้ง 3 ถังถึง 4 °C ภายใน 45–60 นาทีหรือไม่ โดยเฉพาะถัง C ที่เสี่ยงข้นผิดปกติ</p></article><article><h3>H2 · ฟองจาก PBT</h3><p>เบสร้อนน้อย โดยเฉพาะถัง C ทำให้มิกซ์อมอากาศและ %OR เพี้ยนหรือไม่</p></article><article><h3>H3 · เบสห้องเรียน</h3><p>GDDL07 ครีมมี่พอหรือไม่ และไขมัน 7 → 9 ให้ผลต่างอย่างไร</p></article><article><h3>H4 · TS ต่ำ</h3><p>GMDL05 ที่ TS 27.48% มีเนื้อบางหรือสากหรือไม่</p></article></div></details><details><summary>ขั้นตอนหลักและเกณฑ์อุณหภูมิ</summary><ol><li>ทำทีละถัง A → B → C ห้ามสลับ</li><li>สาย ①: SER + น้ำตาลทรายทั้งหมด + น้ำ → 85 °C จนเนียน</li><li>สาย ②: คลุก PMP + DEX + INL แล้วละลายในนม</li><li>รวม ① + ② → 68–70 °C แล้วยกลงทันที</li><li>PBT 2 รอบ รอบละ 30 วินาที พัก 10 วินาที</li><li>Cooling ด้วยอ่างน้ำแข็ง + overhead stirrer · เติมโยเกิร์ตที่ <20 °C · ครีมที่ ≤10 °C · จบที่ 4 °C</li><li>บ่ม 30 นาที · ชั่งมิกซ์ · ปั่น · ชั่งไอศกรีม · แข็งตัว −25 °C จนแกน −14 °C แล้วเก็บ −18 °C</li></ol></details></section>`;
html+=`<section class="screen"><div class="eyebrow">ทำครั้งเดียวก่อนเริ่ม</div><h2>ข้อมูลตั้งต้นวัน</h2>${field('date','วันที่ทดลอง','','date')}${field('operator','ผู้ทำ','','text')}${field('room_temp','อุณหภูมิครัว (°C)','บันทึกค่าจริง','number',null,{step:'0.1'})}<div class="callout">น้ำหนักถ้วยเปล่าบันทึกในคอลัมน์ของแต่ละถังก่อนชั่งมิกซ์</div></section>`;
html+=`<section class="screen"><div class="eyebrow">ช่วงผลิตจริง</div><h2>ถัง A → B → C</h2><p class="sub">แต่ละถังเป็นคอลัมน์ของตัวเองและเรียงช่องจากบนลงล่าง · ทำทีละถังตามลำดับ ห้ามสลับ</p></section><div class="batch-columns">${BATCHES.map(batchColumn).join('')}</div>`;
html+=`<section class="screen"><div class="eyebrow">ชิม 3 จุดเวลา</div><h2>ผลชิม</h2><div class="callout warn">ชิมพร้อมตัวเทียบในวันเดียวกัน เช่น YDDL07 หรือ MKDL08 เพื่อไม่ให้คะแนนครีมมี่ลอยตามอารมณ์</div>${C.weeks.map(w=>`<div class="stage"><h3>${w.label} · ${new Date(w.date+'T00:00:00').toLocaleDateString('th-TH',{dateStyle:'long'})}</h3>${field('ref_sample_'+w.id,'ตัวอย่างที่ใช้เทียบในวันนั้น','','text')}<div class="taste-grid">${BATCHES.map(b=>tasteCard(b,w.id)).join('')}</div></div>`).join('')}</section>`;
html+=`<section class="screen"><div class="eyebrow">ท้ายการทดลอง</div><h2>Verdict</h2><h3>เกณฑ์ดิบ</h3>${check('v_cool','ทุกถัง cooling ถึง 4 °C ภายใน 60 นาที และเครื่องกวนไม่มีปัญหา')}${check('v_or','%OR ทุกถังอยู่ 30–40 และไม่มีอาการมิกซ์อมอากาศ')}${check('v_texture','เนื้อตอนปั่นเสร็จแห้ง–ตั้งตัวทุกถัง ไม่มีเม็ดเนย')}${check('v_creamy','ถัง B ครีมมี่พอ ไม่เหนียว ไม่ฝืด')}${check('v_gm','ถัง A เนื้อแน่นดี ไม่สาก')}${check('v_taste','ไม่มี off-flavor จากเดกซ์โทรสทั้ง 3 ถัง')}<h3>ตัดสินสมมติฐาน</h3><div class="verdict-grid">${hSelect('h1_verdict','H1 · Cooling',['ทั้ง 3 ถังลงตรงเวลา ไม่มีอาการ','ถัง C ข้นผิดปกติแต่ยังกวนไหว','ถัง C กวนไม่ไหว / เป็นก้อน','ช้ากว่า 60 นาทีทุกถัง','ตัดสินไม่ได้'])}${hSelect('h2_verdict','H2 · ฟองจาก PBT',['ถัง C มีฟองชัดและ cup_mix เบากว่า A/B','ไม่มีฟอง และ cup_mix ใกล้เคียงกัน','มีฟองแต่ %OR ยังปกติ','ตัดสินไม่ได้'])}${hSelect('h3_verdict','H3 · เบสห้องเรียน',['B ครีมมี่พอ ไม่เหนียว','B ครีมมี่พอ แต่ C ดีกว่าชัดเจน','B ฝืด / เป็นชอล์ก / เหนียวเป็นยาง','B บางไป','ตัดสินไม่ได้'])}${hSelect('h4_verdict','H4 · TS ต่ำ',['เนื้อแน่นดี ไม่สาก','เนื้อดีแต่เย็นลิ้น / สากเล็กน้อย','บาง / สากชัด','ตัดสินไม่ได้'])}</div><h3>Decision</h3>${select('verdict','ผลรวม',['ผ่าน','ผ่านมีเงื่อนไข','ไม่ผ่าน'])}${area('conclusion','สรุป 3–5 บรรทัด')}${field('action1','สิ่งที่ต้องทำต่อ 1','','text')}${field('action2','สิ่งที่ต้องทำต่อ 2','','text')}${field('action3','สิ่งที่ต้องทำต่อ 3','','text')}<div class="callout warn"><b>ข้อจำกัด — ห้ามลบจากรายงาน</b><ul class="limits">${C.limits.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="toolbar"><button class="btn primary" type="button" id="exportBtn">💾 ส่งออก JSON</button><button class="btn" type="button" onclick="window.print()">🖨 พิมพ์ / PDF</button></div></section>`;
app.innerHTML=html;bind();syncAll();updateClocks();save()}
function n(x){const z=parseFloat(x);return Number.isFinite(z)?z:null}
function setCalc(id,b,x,unit=''){const el=document.getElementById('calc_'+k(id,b));if(x===null){delete D.values[k(id,b)];if(el){el.textContent='—';el.className='calc'};return}D.values[k(id,b)]=typeof x==='number'?x.toFixed(1):x;if(el)el.textContent=D.values[k(id,b)]+(unit?' '+unit:'')}
function warn(id,b,msg){const el=document.querySelector(`[data-warn="${id}"][data-batch="${b||''}"]`);if(el){el.textContent=msg;el.classList.toggle('show',!!msg)}}
function sync(b){const cool=duration('cool_start','cool_end',b),age=duration('age_start','age_stop',b),churn=duration('churn_start','churn_stop',b);setCalc('cool_total',b,cool,'นาที');setCalc('age_minutes',b,age,'นาที');setCalc('stop_minute',b,churn,'นาที');const empty=n(val('cup_empty',b)),mixGross=n(val('cup_mix',b)),i1=n(val('cup_ic_1',b)),i2=n(val('cup_ic_2',b)),mixNet=empty!==null&&mixGross!==null&&mixGross>empty?mixGross-empty:null,n1=empty!==null&&i1!==null&&i1>empty?i1-empty:null,n2=empty!==null&&i2!==null&&i2>empty?i2-empty:null,avg=n1!==null&&n2!==null?(n1+n2)/2:null,diff=avg!==null&&avg>0?Math.abs(n1-n2)/avg*100:null,useAvg=diff!==null&&diff<=5,icNet=diff===null?null:(useAvg?avg:Math.max(n1,n2)),or=mixNet!==null&&icNet!==null&&icNet>0?(mixNet-icNet)/icNet*100:null,repeat=diff===null?null:`สุทธิ ${n1.toFixed(1)} / ${n2.toFixed(1)} g · ต่าง ${diff.toFixed(1)}% → ${useAvg?'ใช้ค่าเฉลี่ย':'ใช้ค่าที่มากกว่า'}`;setCalc('ic_repeat',b,repeat);setCalc('ic_net',b,icNet,'g');setCalc('or_pct',b,or,'%');warn('ic_repeat',b,diff!==null&&diff>5?'สองครั้งต่างกันเกิน 5% — ระบบใช้น้ำหนักสุทธิที่มากกว่า':'');warn('cup_mix',b,mixGross!==null&&mixNet===null?(empty===null?'กรอกน้ำหนักถ้วยเปล่าก่อน':'ถ้วย + มิกซ์ต้องหนักกว่าถ้วย'):'');warn('cup_ic_1',b,i1!==null&&n1===null?(empty===null?'กรอกน้ำหนักถ้วยเปล่าก่อน':'ถ้วย + ไอศกรีมต้องหนักกว่าถ้วย'):'');warn('cup_ic_2',b,i2!==null&&n2===null?(empty===null?'กรอกน้ำหนักถ้วยเปล่าก่อน':'ถ้วย + ไอศกรีมต้องหนักกว่าถ้วย'):'');const pIn=n(val('pbt_in_temp',b)),pEnd=n(val('pbt_end_temp',b)),yt=n(val('yog_temp',b)),ct=n(val('cream_temp',b));warn('pbt_in_temp',b,pIn!==null&&pIn<58?'อุณหภูมิในโถต่ำกว่าเป้า 58 °C — จดใน deviation ด้วย':'');warn('pbt_end_temp',b,pEnd!==null&&pEnd<55?'อุณหภูมิในโถตอนจบ PBT ต่ำกว่าเป้า 55 °C':'');warn('yog_temp',b,yt!==null&&yt>=20?'โยเกิร์ตเข้าร้อนเกิน':'');warn('cream_temp',b,ct!==null&&ct>10?'ครีมเข้าร้อนเกิน':'');warn('cool_total',b,cool!==null&&cool>60?'ช้ากว่าสเปก — เกี่ยวกับ H1 · เขียนใน cool_problem ด้วย':cool!==null&&cool<30?'เร็วกว่า 30 นาที — ตรวจเวลาเริ่มและหยุดอีกครั้ง':'');warn('age_minutes',b,age!==null&&(age<25||age>40)?'เวลาบ่มนอกช่วง 25–40 นาที':'');warn('or_pct',b,or!==null&&or<25?'เช็กฟองหลัง PBT และฟองก่อนชั่ง — อาจเป็นมิกซ์อมอากาศ (H2)':or!==null&&or>45?'%OR สูงกว่า 45 — ตรวจน้ำหนักและวิธีปาดถ้วย':'');const orEl=document.getElementById('calc_'+k('or_pct',b));if(orEl&&or!==null)orEl.className='calc '+(or>=30&&or<=40?'good':or<25||or>45?'bad':'')}
function syncAll(){BATCHES.forEach(sync);const bt=n(val('draw_temp','B')),ct=n(val('draw_temp','C')),msg=bt!==null&&ct!==null&&Math.abs(bt-ct)>2?'อุณหภูมิ B–C ต่างกันเกิน 2 °C — เทียบความครีมมี่กันไม่ได้':'';warn('draw_temp','B',msg);warn('draw_temp','C',msg);save()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>{el.addEventListener(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{D.values[k(el.dataset.id,el.dataset.batch||null)]=el.type==='checkbox'?el.checked:el.value;syncAll()})});document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;D.timers[k(id,b)]=Date.now();if(el.dataset.pair)D.timers[k(el.dataset.pair,b)]=null;beep();syncAll();render()});document.querySelectorAll('[data-manual]').forEach(el=>el.onchange=()=>{D.timers[k(el.dataset.manual,el.dataset.batch)]=el.value?new Date(el.value).getTime():null;syncAll();render()});document.getElementById('exportBtn').onclick=exportJSON}
function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>{el.querySelector('.timer-clock').textContent=durationClock(el.dataset.timer,el.dataset.stop,el.dataset.batch,el.dataset.mode)})}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function exportJSON(){const blob=new Blob([JSON.stringify({_form:C.file,_title:C.title,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=C.file+'-'+(D.values.date||'data')+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x._form!==C.file||!x.values||!x.timers)throw 0;D={values:x.values,timers:x.timers,updated:x.updated||null};save();render();alert('นำเข้าข้อมูลแล้ว')}catch(_){alert('ไฟล์นี้ใช้กับแบบฟอร์ม GKR1 ไม่ได้')}};r.readAsText(f)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดของ GKR1? การทำงานนี้ย้อนกลับไม่ได้')){localStorage.removeItem(KEY);location.reload()}};
document.getElementById('calendarBtn').onclick=()=>{const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Miss Ice Cream//Lab Tasting//TH'];C.weeks.forEach(w=>lines.push('BEGIN:VEVENT','DTSTART;VALUE=DATE:'+w.date.replaceAll('-',''),'SUMMARY:GKR1 '+w.label,'DESCRIPTION:ชิมตัวอย่างถัง A B C พร้อมตัวเทียบ','END:VEVENT'));lines.push('END:VCALENDAR');const a=document.createElement('a'),blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});a.href=URL.createObjectURL(blob);a.download='GKR1-tasting.ics';a.click();URL.revokeObjectURL(a.href)};
setInterval(()=>{updateClocks();BATCHES.forEach(b=>{const start=D.timers[k('age_start',b)],stop=D.timers[k('age_stop',b)];if(start&&!stop&&Math.floor((Date.now()-start)/1000)===1800)beep()})},1000);
render();
})();
</script>
