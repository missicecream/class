<body>
<header><div class="wrap"><a class="back" href="index.html">← กลับหน้าหลัก</a><h1>OO R1 · Oatside worst-case 3 ถัง</h1><p>A เจหวานน้อยไขมัน 6 → B เจหวานเต็มไขมัน 8 → C ครีมหวานเต็มไขมัน 8 · ถังละ 1,000 g · Frigomat G5</p><div class="statusline"><div class="progress"><i id="progress"></i></div><span class="save-state" id="saveState">บันทึกอัตโนมัติ</span></div></div></header>
<main class="wrap"><div id="app"></div><div class="toolbar no-print"><button class="btn" type="button" onclick="document.getElementById('importFile').click()">📂 นำเข้า JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn danger" id="resetBtn" type="button">ล้างข้อมูล</button></div></main>
<footer>OO R1 · MR v8.9.0 · Oatside · ข้อมูลเก็บในเครื่องนี้</footer>
<script>
(() => {
'use strict';
const C={
  file:'OOR1',title:'OO R1 · Oatside worst-case 3 ถัง · MR v8.9.0',
  purpose:'ชิม 3 สูตรที่เสี่ยงที่สุดของ Oatside จากทั้งหมด 12 สูตร เพื่อดูว่าพารามิเตอร์เท่ากับ OG คู่แฝดแล้ว รสและเนื้อใกล้กันจริงหรือไม่',
  critical:'ใช้นมโอ๊ต Oatside รสจืดเท่านั้นและเขย่ากล่องก่อนเททุกกล่อง · สายแยกใช้ SEP เท่านั้น ห้าม SER · A/B เติม CCR ที่ละลายแล้วก่อนยกลง · C ใส่ PMP ท้ายสุดและเติมครีมที่ ≤10 °C · ผลิต A → B → C ห้ามสลับ',
  batches:{
    A:{code:'OONL06 · เจ หวานน้อย ไขมัน 6',summary:'ทดสอบความสากและ body จากโปรตีนต่ำ',rounds:3,targetMix:'1,000',facts:'Fat 6.09% · TS 28.78% · RSW 13.08% · Protein 0.45% · น้ำแข็ง 598 g/kg',formula:['① SEP 6 + SUC 8 + OOS 150 → 65 °C','② DEX 93 + INL 30 + MTD 27 + SLT 1 + OOS 654','③ CCR 31 ละลายแล้ว · รวมมิกซ์ → 55 °C']},
    B:{code:'OONC08 · เจ หวานเต็ม ไขมัน 8',summary:'ทดสอบ INL 2% และความหวานเต็ม',rounds:3,targetMix:'1,000',facts:'Fat 8.09% · TS 29.02% · RSW 15.55% · Protein 0.45% · น้ำแข็ง 598 g/kg',formula:['① SEP 6 + SUC 44 + OOS 150 → 65 °C','② DEX 73 + INL 20 + SLT 1 + OOS 655','③ CCR 51 ละลายแล้ว · รวมมิกซ์ → 55 °C']},
    C:{code:'OODC08 · ครีม หวานเต็ม ไขมัน 8',summary:'ทดสอบ TS 32.44 และรสโอ๊ตเมื่อใช้ครีม',rounds:2,targetMix:'850',facts:'Fat 8.06% · TS 32.44% · RSW 15.43% · Protein 2.79% · น้ำแข็ง 558 g/kg',formula:['① SEP 6 + SUC 58 + OOS 150 → 65 °C','② DEX 40 + INL 20 + SLT 1 + PMP 60 + OOS 515 → 55 °C','③ CRM 150 เติมระหว่าง Cooling ที่ ≤10 °C']}
  },
  limits:['single-arm n=1 ไม่มี control ในรอบ · ชิม 3 ใน 12 สูตร อีก 9 สูตรผ่านโดยอนุมาน','เทียบกับ OG คู่แฝดได้ดีเพราะใช้ G5 1 kg และพารามิเตอร์เท่ากัน แต่ OG ที่เหลือในตู้ไม่ได้ปั่นวันเดียวกัน','ถ้าถังใดไม่ผ่าน ชี้ได้เพียงกลุ่มยี่ห้อ/โปรตีน ยังแยกผล INL ออกจากโปรตีนไม่ได้','ผลชิมใช้ตัดสินเมื่อทุกถังถึง −14 °C และชิมพร้อมกัน','%OR และ draw temperature ใช้ประกอบการตีความ body และความสาก']
};
const BATCHES=['A','B','C'],KEY='missicecream.'+C.file+'.v2';let D=load();
const app=document.getElementById('app'),saveState=document.getElementById('saveState'),progress=document.getElementById('progress');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.values&&x.timers)return x}catch(e){}return{values:{date:'',operator1:'',operator2:'',taster:'เล็ก',limits:C.limits.join('\n')},timers:{},updated:null}}
function save(){D.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(D));saveState.textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});const filled=Object.values(D.values).filter(v=>v!==''&&v!==false).length;progress.style.width=Math.min(100,filled/1.15)+'%'}
function k(id,b){return b?id+'__'+b:id}function val(id,b){return D.values[k(id,b)]??''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attrs(a={}){return Object.entries(a).map(([x,y])=>y===null||y===undefined?'':` ${x}="${esc(y)}"`).join('')}
function field(id,label,help='',type='number',b=null,a={}){return `<label class="field"><span>${label}</span><input type="${type}" data-id="${id}"${b?` data-batch="${b}"`:''} value="${esc(val(id,b))}"${attrs(a)}>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function area(id,label,help='',b=null,a={}){return `<label class="field"><span>${label}</span><textarea data-id="${id}"${b?` data-batch="${b}"`:''}${attrs(a)}>${esc(val(id,b))}</textarea>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function select(id,label,opts,help='',b=null,a={}){return `<label class="field"><span>${label}</span><select data-id="${id}"${b?` data-batch="${b}"`:''}${attrs(a)}><option value="">— เลือก —</option>${opts.map(x=>`<option${val(id,b)===x?' selected':''}>${esc(x)}</option>`).join('')}</select>${help?`<small class="help">${help}</small>`:''}<div class="warning" data-warn="${id}" data-batch="${b||''}"></div></label>`}
function selectOther(id,label,opts,help='',b=null){const show=val(id,b)==='อื่นๆ';return select(id,label,[...opts,'อื่นๆ'],help,b)+`<div class="other-field${show?'':' hidden'}" data-other="${id}" data-batch="${b||''}">${field(id+'_other','ระบุเพิ่มเติม','','text',b)}</div>`}
function calc(id,label,unit='',b=null){return `<div class="field"><span>${label}</span><div class="calc" id="calc_${k(id,b)}">${val(id,b)!==''?esc(val(id,b))+(unit?' '+unit:''):'—'}</div><div class="warning" data-warn="${id}" data-batch="${b||''}"></div></div>`}
function toLocal(ms){if(!ms)return'';const d=new Date(ms),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function timeText(ms){return ms?new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function duration(start,stop,b){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)];return a&&z&&z>=a?(z-a)/60000:null}
function clock(start,stop,b,mode='up'){const a=D.timers[k(start,b)],z=D.timers[k(stop,b)],sec=a?Math.max(0,Math.floor(((z||Date.now())-a)/1000)):0,t=mode==='down'?Math.max(0,1800-sec):sec;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function manual(id,label,b){return `<label>${label}<input type="datetime-local" step="1" data-manual="${id}" data-batch="${b}" value="${esc(toLocal(D.timers[k(id,b)]))}"></label>`}
function timer(start,stop,label,b,mode='up',startText='เริ่ม',stopText='หยุด'){return `<div class="timer" data-timer="${start}" data-stop="${stop}" data-batch="${b}" data-mode="${mode}"><div class="timer-label">${label}</div><div class="timer-clock">${clock(start,stop,b,mode)}</div><div class="timer-actions"><button class="btn green" type="button" data-stamp="${start}" data-pair="${stop}" data-batch="${b}">${startText}</button><button class="btn amber" type="button" data-stamp="${stop}" data-batch="${b}">${stopText}</button></div><div class="help">เริ่ม: ${timeText(D.timers[k(start,b)])} · หยุด: ${timeText(D.timers[k(stop,b)])}</div><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual(start,'เริ่ม',b)}${manual(stop,'หยุด',b)}</div></details></div>`}
function milestone(id,label,b,buttonText){return `<div class="stamp"><div class="timer-label">${label}</div><div class="stamp-time">${timeText(D.timers[k(id,b)])}</div><button class="btn green" type="button" data-stamp="${id}" data-batch="${b}">${buttonText}</button><details><summary>แก้เวลาด้วยมือ</summary><div class="manual-grid">${manual(id,'เวลาที่บันทึก',b)}</div></details></div>`}
function stage(title,body,sub=''){return `<div class="stage"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</div>`}
function formulaCard(b){const x=C.batches[b];return `<article class="formula-card"><h3>ถัง ${b} · ${x.code}</h3><p class="sub">${x.summary}</p><ul>${x.formula.map(y=>`<li>${y}</li>`).join('')}</ul><div class="facts">${x.facts}</div><div class="total">รวม 1,000 g</div></article>`}
function batchColumn(b){const x=C.batches[b],prepWarn=b==='A'?`<div class="callout warn"><b>ถัง A น้ำตาลในสาย SEP เพียง 8 g</b> · คลุก SEP กับน้ำตาลให้ทั่วก่อนลงนม เพื่อป้องกัน SEP จับก้อน</div>`:'',oilLook=b!=='C'?select('oil_look','หลัง PBT น้ำมันมะพร้าวลอยหน้าไหม',['ไม่ลอย','ลอยเล็กน้อย','แยกชั้นชัด'],'',b):'',creamStamp=b==='C'?milestone('time_at_10c','ถึง 10 °C — เติมครีม 150 g',b,'ถึง 10 °C / เติมครีม'):'',finishLook=b==='C'?select('butter_granule','เม็ดเนย',['ไม่มี','เล็กน้อย','ชัดเจน'],'',b):select('oil_sep','น้ำมันมะพร้าวแยก / เกาะใบพัด',['ไม่มี','เล็กน้อย','ชัดเจน'],'',b);return `<div class="batch-column"><section class="screen batch-title"><div class="eyebrow">ลำดับผลิต ${BATCHES.indexOf(b)+1} · คอลัมน์ ${b}</div><h2>ถัง ${b} · ${x.code}</h2><p class="sub">${x.summary} · กรอกจากบนลงล่าง</p></section><section class="screen">
${stage('1 · ต้มสาย SEP · รวมมิกซ์ · PBT',prepWarn+`<div class="callout"><b>${b==='C'?'ใส่ PMP ท้ายสุด':'เติม CCR ที่ละลายแล้ว'}</b> · รวมส่วนผสม → 55 °C แล้วยกลง · PBT ${x.rounds} รอบ × 30 วินาที พัก 10 วินาที</div>`+field('temp_pbt_start','อุณหภูมิมิกซ์ในโถก่อน PBT (°C)','เป้า ≥45 °C','number',b,{step:'0.1'})+field('temp_pbt_end',`อุณหภูมิหลัง PBT รอบ ${x.rounds} (°C)`,'เป้า ≥40 °C','number',b,{step:'0.1'})+field('mix_weight','น้ำหนักมิกซ์จริงหลัง PBT ก่อนเทลงโถ (g)',`ค่าคาดหมายประมาณ ${x.targetMix} g · ใช้ดูน้ำหนักที่หายจริง ไม่มีเกณฑ์เตือน`,'number',b,{step:'0.1',min:'0'})+oilLook,'ชั่งหลัง PBT · ไม่มีช่องอุณหภูมิระหว่างต้ม · ไม่มีช่องจำนวนรอบหรือเวลาพัก')}
${stage('2 · Cooling',timer('cool_start_time','time_at_4c','จับเวลา Cooling ถึง 4 °C',b,'up','เริ่ม cooling','ถึง 4 °C')+field('stirrer_speed','ความเร็ว stirrer ที่ตั้ง','ระดับ / rpm ตามที่ตั้งจริง','text',b)+creamStamp+calc('cool_total','เวลา Cooling รวม','นาที',b),b==='C'?'อ่างน้ำแข็ง + overhead stirrer · ถึง 10 °C แล้วค่อยๆ เติมครีมขณะ stirrer หมุน':'อ่างน้ำแข็ง + overhead stirrer · ลดอุณหภูมิถึง 4 °C')}
${stage('3 · บ่มสั้น 30 นาที',timer('age_start','age_stop','นับถอยหลังบ่ม 30 นาที',b,'down','เริ่มบ่ม','ยกออกมาเท')+calc('age_minutes','เวลาบ่มจริง','นาที',b)+selectOther('age_look','ลักษณะมิกซ์หลังบ่ม 30 นาที',['เนียน-ไหล','ข้นขึ้นแต่ยังไหล','ลิ่ม-เป็นวุ้น (panna cotta)','แยกชั้น'],'สังเกตหลังบ่มครบ ก่อนเทเข้าเครื่อง',b),'บ่มที่ 0–4 °C · ครบแล้วเทเข้าเครื่องทันที')}
${stage('4 · ชั่งมิกซ์ · เทเข้าเครื่อง',field('cup_empty','น้ำหนักถ้วยเปล่า — สำหรับวัด %OR (g)','บันทึกแยกทุกถัง','number',b,{step:'0.1',min:'0'})+field('cup_mix','น้ำหนักถ้วย + มิกซ์ ปาดเรียบ (g)','เทส่วนที่ไม่เป็นฟอง · เคาะไล่ฟอง · ใช้ถ้วยใบเดียวกันตลอด','number',b,{step:'0.1',min:'0'})+calc('mix_net','น้ำหนักมิกซ์สุทธิ','g',b)+field('entry_temp','อุณหภูมิมิกซ์ในโถก่อนกดปั่น (°C)','บันทึกค่าจริงเพื่อใช้ตีความ','number',b,{step:'0.1'})+`<div class="callout"><b>ลำดับเทจริง</b> ① เทฟองลงโถ ② เทส่วนไม่เป็นฟองใส่ถ้วยชั่ง ③ เทกลับลงโถทั้งหมด ④ วัดอุณหภูมิในโถ ⑤ กดเริ่มนาฬิกาพร้อมเดินเครื่อง</div>`)}
${stage('5 · ปั่น · ปั่นเสร็จ · %OR',timer('churn_start','churn_stop','นาฬิกาจับเวลาการปั่น',b,'up','เริ่มปั่น','หยุดเมื่อปั่นเสร็จ')+calc('churn_minutes','เวลาปั่นจริง','นาที',b)+select('machine_stop_type','เครื่องตัดเอง หรือกดหยุด',['เครื่องตัดเอง','กดหยุด'],'',b)+field('draw_temp','อุณหภูมิตอนปั่นเสร็จ (°C)','เป้า −12 °C · เตือนถ้าสูงกว่า −10 °C','number',b,{step:'0.1'})+select('texture_after','ลักษณะเนื้อไอศกรีม',['แห้งเนียนปกติ','น้ำซึม','เหลวเปียก'],'ดูทันทีหลังเครื่องหยุด',b)+field('cup_ic_1','น้ำหนักถ้วย + ไอศกรีม ปาดเรียบ — ครั้งที่ 1 (g)','ใช้ถ้วยใบเดิม · ตัก อัด และปาดหน้าให้เรียบ','number',b,{step:'0.1',min:'0'})+field('cup_ic_2','น้ำหนักถ้วย + ไอศกรีม ปาดเรียบ — ครั้งที่ 2 (g)','เอาออกแล้วตักใหม่ อัดใหม่ และปาดใหม่','number',b,{step:'0.1',min:'0'})+`<div class="third-weight hidden" data-third="${b}">${field('cup_ic_3','น้ำหนักถ้วย + ไอศกรีม ปาดเรียบ — ครั้งที่ 3 (g)','เปิดเมื่อครั้งที่ 1 และ 2 ต่างกันเกิน 3 g','number',b,{step:'0.1',min:'0'})}</div>`+calc('ic_check','ตรวจการชั่ง','',b)+calc('ic_net','น้ำหนักไอศกรีมสุทธิที่ใช้คำนวณ','g',b)+calc('overrun','%OR','%',b)+`<div class="callout"><b>สูตรคำนวณ</b><br>(น้ำหนักมิกซ์สุทธิ − น้ำหนักไอศกรีมสุทธิ) ÷ น้ำหนักไอศกรีมสุทธิ × 100 · เป้า 30–45%</div>`+finishLook+area('deviation','สิ่งที่ต่างจากแผน','ถ้าไม่มีให้เขียนว่า “ไม่มี”',b),'กดเริ่มนาฬิกาพร้อมเครื่อง · ชั่งไอศกรีม 2 ครั้ง และเปิดครั้งที่ 3 เมื่อสองครั้งแรกต่างกันเกิน 3 g')}
</section></div>`}
function score(id,label,min,max,help,b,gate=true){const locked=gate&&!val('temp_taste',b),a={min,max,step:'1'};if(gate)a['data-taste']='1';if(locked)a.disabled='';if(max===10)return `<div class="score-field">${field(id,label,'กรอกคะแนน 0–10','number',b,a)}</div>`;const values=Array.from({length:max-min+1},(_,i)=>min+i),cls=values.length===4?'scale scale4':'scale';return `<div class="field score-field"><span>${label}</span><div class="${cls}">${values.map(v=>`<label><input type="radio" name="${k(id,b)}" data-id="${id}" data-batch="${b}" data-taste="1" value="${v}"${String(val(id,b))===String(v)?' checked':''}${locked?' disabled':''}><span>${v>0?'+'+v:v}</span></label>`).join('')}</div><small class="help">${help}</small></div>`}
function tasteCard(b){const locked=!val('temp_taste',b),a=locked?{'data-taste':'1',disabled:''}:{'data-taste':'1'},cream=b==='C'?score('s_buttery','Buttery เพดานปาก',0,3,'0 ไม่มี · 3 เด่นมาก',b)+score('s_dairy','รสนม / ครีมนำ',0,3,'0 ไม่มี · 3 เด่นมาก',b):'';return `<article class="taste-card${locked?' locked':''}" data-taste-card="${b}"><h3>ถัง ${b} · ${C.batches[b].code}</h3><div class="callout warn taste-lock${locked?'':' hidden'}" data-taste-lock="${b}">กรอกอุณหภูมิกลางถังก่อน จึงจะเปิดช่องให้คะแนน</div>${field('temp_taste','อุณหภูมิกลางถังตอนชิม (°C)','เป้า −14 °C · ยอมรับ −14.5 ถึง −13.5','number',b,{step:'0.1'})}${score('s_scoop','ตักง่าย',-3,3,'−3 ตักยากไป · 0 พอดี · +3 นิ่มไป',b)}${score('s_sweet','ความหวานโดยรวม',-3,3,'−3 น้อยไป · 0 พอดี · +3 มากไป',b)}${score('s_thick','ความข้น',-3,3,'−3 บางไป · 0 พอดี · +3 ข้นไป',b)}${score('s_body','เนื้อแน่น body',-3,3,'−3 บางไป · 0 พอดี · +3 แน่นไป',b)}${score('s_stretch','หนืดยืด',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_gummy','Gummy',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${cream}${score('s_cold','อุ่น–เย็นลิ้น',-3,3,'−3 อุ่น · 0 พอดี · +3 เย็นลิ้นมาก',b)}${score('s_sandy','ความสาก',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_dex','รสเดกซ์โทรส / หวานแบน',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_aftertaste','หวานค้างคอ',-3,3,'−3 น้อยไป · 0 พอดี · +3 มากไป',b)}${score('s_oaty','รสโอ๊ต',0,3,'0 ไม่มี · 3 เด่นมาก',b)}${score('s_like','ชอบโดยรวม',0,10,'0–10',b)}${area('s_note','บันทึกเพิ่ม','',b,a)}</article>`}
function criterionCard(b){return `<article class="criteria-card"><h3>ถัง ${b}</h3>${select('v_draw','ปั่นถึง −12 โดยเครื่องไม่ตัดก่อน',['ได้','ไม่ได้'],'',b)}${select('v_texture','เนื้อแห้ง-ตั้งตัว ไม่ลิ่ม',['ใช่','ไม่ใช่'],'',b)}${select('v_or','%OR 30–45',['เข้า','ต่ำกว่า','สูงกว่า'],'',b)}${select('v_taste','ชิมที่ −14 แล้วรับได้',['ใช่','ไม่ใช่'],'',b)}</article>`}
function hSelect(id,label,opts){return `<div>${select(id,label,opts)}${area(id.replace('_verdict','_note'),'เหตุผล / หลักฐานที่ใช้ตัดสิน')}</div>`}
function parameterTable(){return `<div class="scroll"><table class="parameter-table"><thead><tr><th>Parameter</th><th>Target</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody><tr><td>Fat%</td><td>6/8 ±0.15</td><td>6.09</td><td>8.09</td><td>8.06</td></tr><tr><td>Protein%</td><td>ข้อมูล</td><td>0.45</td><td>0.45</td><td>2.79</td></tr><tr><td>TS%</td><td>N 27.5–31 · D ≤32</td><td>28.78</td><td>29.02</td><td>32.44 ⚠️</td></tr><tr><td>RSW%</td><td>13 / 15.5</td><td>13.08</td><td>15.55</td><td>15.43</td></tr><tr><td>S&amp;B%</td><td>13–17</td><td>15.8</td><td>13.7</td><td>11.8 ⚠️</td></tr><tr><td>DEX share</td><td>ข้อมูล</td><td>73</td><td>48</td><td>28</td></tr><tr><td>น้ำแข็ง g/kg</td><td>= OG</td><td>598</td><td>598</td><td>558</td></tr><tr><td>%OR</td><td>30–45</td><td colspan="3">คำนวณจากข้อมูลระหว่างผลิต</td></tr></tbody></table></div>`}
function render(){let html=`<section class="screen"><div class="eyebrow">แผนการทดลอง · อ่านก่อนเริ่ม</div><h2>${C.title}</h2><p class="lead">${C.purpose}</p><div class="callout danger">${C.critical}</div><div class="formula-grid">${BATCHES.map(formulaCard).join('')}</div><details><summary>คำถามวิจัย H1–H4</summary><div class="research-grid"><article><h3>H1 · โปรตีนต่ำ</h3><p>A สากหรือ body บางกว่า OGNL06 หรือไม่</p></article><article><h3>H2 · INL 2%</h3><p>B/C หลังบ่ม 30 นาทียังเนียน ไม่ลิ่ม และไม่ gummy หรือไม่</p></article><article><h3>H3 · ความหวานข้ามยี่ห้อ</h3><p>RSW เท่า OG แล้วหวานเท่ากันจริงหรือไม่</p></article><article><h3>H4 · สูตรครีม</h3><p>C แน่น หนัก หรือ buttery ไหม และรสโอ๊ตยังชัดหรือไม่</p></article></div></details><details><summary>พารามิเตอร์สูตรที่คำนวณไว้</summary>${parameterTable()}</details><details><summary>ขั้นตอนหลักและเกณฑ์</summary><ol><li>เขย่ากล่อง Oatside ก่อนเททุกกล่อง</li><li>ทำทีละถัง A → B → C ห้ามสลับ</li><li>สาย SEP: OOS 150 g + SEP + น้ำตาลทราย → 65 °C จนใส</li><li>รวมมิกซ์ → A/B เติม CCR ที่ละลายแล้ว → 55 °C แล้วยกลง</li><li>PBT A/B 3 รอบ · C 2 รอบ × 30 วินาที พัก 10 วินาที · เริ่ม ≥45 °C · จบ ≥40 °C</li><li>ชั่งน้ำหนักมิกซ์หลัง PBT เพื่อดูน้ำหนักที่หายจริง</li><li>Cooling ถึง 4 °C · C เติมครีมเมื่อถึง 10 °C</li><li>บ่ม 30 นาทีที่ 0–4 °C แล้วเทเข้าเครื่องทันที</li><li>กดเริ่มนาฬิกาพร้อมเครื่องปั่น</li><li>Temper ทุกถังถึง −14 °C แล้วชิมพร้อมกัน</li></ol></details></section>`;html+=`<section class="screen"><div class="eyebrow">กรอกก่อนเริ่ม</div><h2>ข้อมูลตั้งต้นวัน</h2><div class="action-grid">${field('date','วันที่ทดลอง','','date')}${field('taster','ผู้ชิม','','text')}${field('operator1','ผู้ทำคนที่ 1','','text')}${field('operator2','ผู้ทำคนที่ 2','','text')}</div></section>`;html+=`<section class="screen"><div class="eyebrow">ช่วงผลิตจริง</div><h2>ถัง A → B → C</h2><p class="sub">สามถังวางขนานกัน แต่ละถังกรอกจากบนลงล่างตาม timeline การทำงานจริง</p></section><div class="batch-columns">${BATCHES.map(batchColumn).join('')}</div>`;html+=`<section class="screen"><div class="eyebrow">เปิดกรอกตอนชิม</div><h2>Blind tasting · −14 °C · พร้อมกัน 3 ถัง</h2><div class="callout danger">วัดอุณหภูมิกลางถังให้ได้ −14 °C ก่อนชิมทุกถัง · ถ้ามี OG คู่แฝดเหลือ ให้นำมา temper และชิมเทียบพร้อมกัน</div><div class="taste-grid">${BATCHES.map(tasteCard).join('')}</div></section>`;html+=`<section class="screen"><div class="eyebrow">ท้ายการทดลอง</div><h2>Hypothesis Verdict</h2><h3>เกณฑ์ดิบรายถัง</h3><div class="criteria-grid">${BATCHES.map(criterionCard).join('')}</div><h3>ตัดสิน H ทีละข้อ</h3><div class="verdict-grid">${hSelect('h1_verdict','H1 · ความสาก / body',['สาก ≤1 body ≥ −1 ตักได้ — ผ่าน params เท่ากันใช้ได้กับสาย N','body −2 / %OR <30 — โปรตีนไม่พอ เพิ่ม INL 30 ทุกสูตร N หรือ SEP 7','สาก ≥2 — เปิดรอบเทียบ OOS vs OOG','ตัดสินไม่ได้ — ทำซ้ำ'])}${hSelect('h2_verdict','H2 · INL 20 + บ่มสั้น',['เนียน ไม่ลิ่ม gummy 0–1 — INL 20 + บ่มสั้นใช้ได้ lock SEP 6','B/C สากกว่า A — บังคับ INL 25 ยอม TS เกิน','ลิ่มตอนบ่ม — ลด SEP → 5','ตัดสินไม่ได้ — ทำซ้ำถังนั้น'])}${hSelect('h3_verdict','H3 · ความหวาน / DEX',['หวานเท่า OG A ไม่รู้สึก DEX — RSW ใช้ข้ามยี่ห้อได้','หวานน้อยกว่า OG — ปรับ RS ของ OOS ใน MR','หวานมากกว่า OG — ปรับ RS OOS ลง','A รู้สึก DEX / เย็นลิ้น — บังคับ DEX share 40 re-solve สาย L','ตัดสินไม่ได้ — ชิมไม่ถึง −14'])}${hSelect('h4_verdict','H4 · TS / ครีม / รสโอ๊ต',['body 0–1 ไม่ buttery โอ๊ต ≥1 — ผ่าน TS 32.44 รับได้','แน่น/หนัก ≥2 — ลด PMP 55 re-solve OODC08','โอ๊ต 0 ครีมกลบ — ถามเล็ก','buttery/เม็ดเนย — เรื่อง PBT/ครีม','ตัดสินไม่ได้ — %OR นอกเป้ามาก'])}</div><h3>Decision &amp; Next Steps</h3>${select('verdict','Verdict รวม',['ผ่านทั้ง 3 → ถือว่า 12 สูตร Oatside ผ่าน ทำไฟล์ LOCK 06OO v1.0','ผ่าน A+B — สาย N ผ่าน · C ต้องแก้','ผ่าน C — สาย D ผ่าน · สาย N ต้องแก้','ผ่านบางส่วน — ระบุ','ไม่ผ่าน','ตัดสินไม่ได้'])}${area('conclusion','สรุป')}<div class="action-grid">${field('action1','Action ถัดไป 1','','text')}${field('action2','Action ถัดไป 2','','text')}${field('action3','Action ถัดไป 3','','text')}</div>${area('limits','ข้อจำกัดการตีความ','แก้ไขหรือเพิ่มเติมได้')}<div class="toolbar"><button class="btn primary" type="button" id="exportBtn">💾 ส่งออก JSON</button><button class="btn" type="button" onclick="window.print()">🖨 พิมพ์ / PDF</button></div></section>`;app.innerHTML=html;bind();syncAll();updateClocks();save()}
function n(x){const z=parseFloat(x);return Number.isFinite(z)?z:null}
function setCalc(id,b,x,unit=''){const el=document.getElementById('calc_'+k(id,b));if(x===null){delete D.values[k(id,b)];if(el){el.textContent='—';el.className='calc'}return}D.values[k(id,b)]=typeof x==='number'?x.toFixed(1):x;if(el){el.textContent=D.values[k(id,b)]+(unit?' '+unit:'');el.className='calc'}}
function warn(id,b,msg){const el=document.querySelector(`[data-warn="${id}"][data-batch="${b||''}"]`);if(el){el.textContent=msg;el.classList.toggle('show',!!msg)}}
function iceSelection(b,cup){const g1=n(val('cup_ic_1',b)),g2=n(val('cup_ic_2',b)),g3=n(val('cup_ic_3',b)),i1=g1!==null&&cup>0&&g1>cup?g1-cup:null,i2=g2!==null&&cup>0&&g2>cup?g2-cup:null,i3=g3!==null&&cup>0&&g3>cup?g3-cup:null;if(!(i1>0&&i2>0))return{needThird:false,selected:null,note:null,reliable:false};const d12=Math.abs(i1-i2);if(d12<=3)return{needThird:false,selected:(i1+i2)/2,note:`ครั้งที่ 1↔2 ต่าง ${d12.toFixed(1)} g → ใช้ค่าเฉลี่ย`,reliable:true};if(!(i3>0))return{needThird:true,selected:null,note:`ครั้งที่ 1↔2 ต่าง ${d12.toFixed(1)} g → ต้องชั่งครั้งที่ 3`,reliable:false};const pairs=[{ids:'1 และ 2',a:i1,b:i2,d:d12},{ids:'1 และ 3',a:i1,b:i3,d:Math.abs(i1-i3)},{ids:'2 และ 3',a:i2,b:i3,d:Math.abs(i2-i3)}].sort((a,b)=>a.d-b.d),best=pairs[0];if(best.d<=3)return{needThird:true,selected:(best.a+best.b)/2,note:`ใช้ครั้งที่ ${best.ids} · คู่ที่ใกล้ที่สุดต่าง ${best.d.toFixed(1)} g`,reliable:true};return{needThird:true,selected:null,note:`ทั้ง 3 ครั้งยังกระจาย · คู่ที่ใกล้ที่สุดต่าง ${best.d.toFixed(1)} g → ชั่งใหม่`,reliable:false}}
function toggleTaste(b){const enabled=val('temp_taste',b)!=='';const card=document.querySelector(`[data-taste-card="${b}"]`),lock=document.querySelector(`[data-taste-lock="${b}"]`);if(card)card.classList.toggle('locked',!enabled);if(lock)lock.classList.toggle('hidden',enabled);document.querySelectorAll(`[data-taste="1"][data-batch="${b}"]`).forEach(el=>el.disabled=!enabled)}
function toggleOther(b){document.querySelectorAll(`[data-other][data-batch="${b}"]`).forEach(el=>el.classList.toggle('hidden',val(el.dataset.other,b)!=='อื่นๆ'))}
function sync(b){const cool=duration('cool_start_time','time_at_4c',b),age=duration('age_start','age_stop',b),churn=duration('churn_start','churn_stop',b),cup=n(val('cup_empty',b)),mixGross=n(val('cup_mix',b)),mix=cup>0&&mixGross>cup?mixGross-cup:null,ice=iceSelection(b,cup);setCalc('cool_total',b,cool,'นาที');setCalc('age_minutes',b,age,'นาที');setCalc('churn_minutes',b,churn,'นาที');setCalc('mix_net',b,mix,'g');const third=document.querySelector(`[data-third="${b}"]`);if(third)third.classList.toggle('hidden',!ice.needThird);setCalc('ic_check',b,ice.note);setCalc('ic_net',b,ice.selected,'g');const or=mix>0&&ice.selected>0?(mix-ice.selected)/ice.selected*100:null;setCalc('overrun',b,or,'%');const ps=n(val('temp_pbt_start',b)),pe=n(val('temp_pbt_end',b)),draw=n(val('draw_temp',b)),tt=n(val('temp_taste',b));warn('temp_pbt_start',b,ps!==null&&ps<45?'อุณหภูมิก่อน PBT ต่ำกว่า 45 °C':'');warn('temp_pbt_end',b,pe!==null&&pe<40?'PBT จบต่ำกว่า 40 °C — ห้ามข้าม':'');warn('age_minutes',b,age!==null&&age>32?'บ่มเกิน 30 นาที — ระบุในสิ่งที่ต่างจากแผน':'');warn('draw_temp',b,draw!==null&&draw>-10?'ปั่นไม่ถึงเป้า — เช็ควิธีที่เครื่องหยุด':'');warn('cup_empty',b,cup!==null&&cup<=0?'น้ำหนักถ้วยเปล่าต้องมากกว่า 0':'');warn('cup_mix',b,mixGross!==null&&(cup===null||cup<=0)?'กรอกน้ำหนักถ้วยเปล่าก่อน':mixGross!==null&&mix===null?'ถ้วย + มิกซ์ต้องหนักกว่าถ้วยเปล่า':'');['cup_ic_1','cup_ic_2','cup_ic_3'].forEach(id=>{const g=n(val(id,b));warn(id,b,g!==null&&(cup===null||cup<=0)?'กรอกน้ำหนักถ้วยเปล่าก่อน':g!==null&&g<=cup?'ถ้วย + ไอศกรีมต้องหนักกว่าถ้วยเปล่า':'')});warn('ic_check',b,ice.needThird&&!ice.reliable?ice.note:'');warn('overrun',b,or!==null&&(or<30||or>45)?'%OR นอกเป้า 30–45%':'');const orEl=document.getElementById('calc_'+k('overrun',b));if(orEl&&or!==null)orEl.className='calc '+(or>=30&&or<=45?'good':'bad');warn('temp_taste',b,tt!==null&&(tt<-14.5||tt>-13.5)?'ยังไม่ถึง −14 °C — ผลเปรียบเทียบจะตัดสินไม่ได้':'');toggleTaste(b);toggleOther(b)}
function syncAll(){BATCHES.forEach(sync);save()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{D.values[k(el.dataset.id,el.dataset.batch||null)]=el.type==='checkbox'?el.checked:el.value;syncAll()}));document.querySelectorAll('[data-stamp]').forEach(el=>el.onclick=()=>{const b=el.dataset.batch,id=el.dataset.stamp;D.timers[k(id,b)]=Date.now();if(el.dataset.pair)D.timers[k(el.dataset.pair,b)]=null;beep();render()});document.querySelectorAll('[data-manual]').forEach(el=>el.onchange=()=>{D.timers[k(el.dataset.manual,el.dataset.batch)]=el.value?new Date(el.value).getTime():null;render()});document.getElementById('exportBtn').onclick=exportJSON}
function updateClocks(){document.querySelectorAll('[data-timer]').forEach(el=>el.querySelector('.timer-clock').textContent=clock(el.dataset.timer,el.dataset.stop,el.dataset.batch,el.dataset.mode))}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=720;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function exportJSON(){const blob=new Blob([JSON.stringify({_form:C.file,_title:C.title,_exported:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=C.file+'-'+(D.values.date||'data')+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x._form!==C.file||!x.values||!x.timers)throw 0;D={values:x.values,timers:x.timers,updated:x.updated||null};render();alert('นำเข้าข้อมูลแล้ว')}catch(_){alert('ไฟล์นี้ใช้กับแบบฟอร์ม OOR1 ไม่ได้')}};r.readAsText(f)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดของ OOR1? การทำงานนี้ย้อนกลับไม่ได้')){localStorage.removeItem(KEY);location.reload()}};
setInterval(()=>{updateClocks();BATCHES.forEach(b=>{const start=D.timers[k('age_start',b)],stop=D.timers[k('age_stop',b)];if(start&&!stop&&Math.floor((Date.now()-start)/1000)===1800)beep()})},1000);
render();
})();
</script>
